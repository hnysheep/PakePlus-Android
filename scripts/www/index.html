// 判断某条待导入歌曲是否已经在播放列表里
function findPlaylistDuplicate(item) {
  if (!item) return false;
  const list = state.songs || [];
  if (item.nativeId && list.some(s => s.id === item.nativeId)) return true;
  if (item.nativePath && list.some(s => s.nativePath && s.nativePath === item.nativePath)) return true;

  const name = (item.name || '').trim();
  if (!name) return false;
  return list.some(s => {
    if ((s.name || '').trim() !== name) return false;
    const a = item.artist || '';
    const b = s.artist || '';
    if (a && b) return artistLooseEq(a, b);
    return true;
  });
}

async function confirmImportSelected() {
  const selectedItems = pendingImportFiles.filter(i => i.selected);
  if (selectedItems.length === 0) {
    alert('请至少选择一首歌曲');
    return;
  }

  // 有重复的就先弹确认框：取消 / 导入（选导入则照样入库，允许列表里出现重复条目）
  const dupItems = selectedItems.filter(i => findPlaylistDuplicate(i));
  if (dupItems.length > 0) {
    // 弹确认框之前先把导入界面关掉，避免两层浮层叠在一起
    closeImportModal();
    pendingImportFiles = [];
    const sampleNames = dupItems.slice(0, 3).map(i => '《' + (i.name || '未知歌曲') + '》').join('、');
    const more = dupItems.length > 3 ? ' 等' : '';
    const ok = await appConfirm({
      title: '发现重复歌曲',
      message: `其中 ${dupItems.length} 首已在播放列表中${dupItems.length <= 3 ? '：' + sampleNames : ''}${more}。\n仍要导入吗？`,
      okText: '导入',
      cancelText: '取消'
    });
    if (!ok) return;
  }

  // 拆成两类：App 内媒体库扫描到的歌曲 / 网页端选择的文件
  // 系统选择器挑出来的文件只有 path 没有 mediaId，也必须按本机歌曲走
  const nativeItems = selectedItems.filter(i => !i.file && (i.nativeId || i.nativePath));
  const fileItems = selectedItems.filter(i => i.file).map(i => i.file);

  let importedCount = 0;

  if (nativeItems.length > 0) {
    // 没有可读路径的先让原生按 mediaId 复制成实体文件，再入库
    showImportNotice('正在导入 ' + nativeItems.length + ' 首…');
    const ready = await ensureNativePaths(nativeItems);
    importedCount += await importNativeTracks(ready);
  }
  if (fileItems.length > 0) {
    const failCount = await importFiles(fileItems);
    importedCount += fileItems.length - failCount;
  }

  closeImportModal();
  pendingImportFiles = [];
  if (importedCount > 0) {
    alert(`成功导入 ${importedCount} 首音乐`);
  } else {
    alert('导入失败：无法读取所选文件\n请确认已开启本应用的存储/音乐文件访问权限');
  }
}

/**
 * 保证每个待导入的原生歌曲都有一个网页能播放的本地路径。
 * 有可读路径的直接用；没有的交给原生 importAudioIds() 从 MediaStore 复制到 App 私有目录。
 * 返回真正可入库的条目列表。
 */
async function ensureNativePaths(items) {
  const ready = [];
  const needCopy = [];

  items.forEach(it => {
    if (it.nativePath && it.needsCopy !== true) ready.push(it);
    else needCopy.push(it);
  });

  if (needCopy.length === 0) return ready;

  const plugin = nativePlugin();
  if (!plugin || typeof plugin.importAudioIds !== 'function') {
    // 老包没有这个原生方法：只能退回用原有路径碰运气
    needCopy.forEach(it => { if (it.nativePath) ready.push(it); });
    console.log('当前安装包不支持 importAudioIds，已退回路径直读');
    return ready;
  }

  const ids = needCopy
    .map(it => it.mediaId)
    .filter(v => v !== undefined && v !== null && v !== '');

  if (ids.length === 0) {
    needCopy.forEach(it => { if (it.nativePath) ready.push(it); });
    return ready;
  }

  let copied = [];
  try {
    const res = await plugin.importAudioIds({ ids });
    copied = (res && res.files) || [];
  } catch (err) {
    console.log('原生复制媒体文件失败:', err);
    needCopy.forEach(it => { if (it.nativePath) ready.push(it); });
    return ready;
  }

  copied.forEach(f => {
    ready.push({
      file: null,
      nativeId: f.nativeId || ('native-' + f.mediaId),
      mediaId: f.mediaId,
      nativePath: f.path,
      readable: true,
      needsCopy: false,
      name: f.name || '未知歌曲',
      artist: f.artist || '',
      duration: f.duration || 0,
      selected: true
    });
  });

  return ready;
}

// App 内：把扫描到的本机歌曲加入播放列表并持久化
async function importNativeTracks(items) {
  if (!items || items.length === 0) return 0;

  const added = [];
  const writes = [];

  items.forEach(item => {
    let id = item.nativeId || ('native-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8));
    // 用户确认"仍要导入"的重复歌曲：换一个唯一 id，避免把原有记录覆盖掉
    if (findPlaylistDuplicate(item)) {
      id = (item.nativeId || 'native') + '-dup-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6);
    }
    const song = {
      id: id,
      name: item.name || '未知歌曲',
      artist: item.artist || '',
      url: toPlayableUrl(item.nativePath),
      nativePath: item.nativePath,
      duration: item.duration || 0,
      addedAt: Date.now(),
      isFav: false
    };
    added.push({ song, record: {
      id: id,
      name: song.name,
      artist: song.artist,
      nativePath: item.nativePath,
      type: '',
      duration: song.duration,
      addedAt: song.addedAt,
      isFav: false
    }});
  });

  // 一次性全部进播放列表，避免逐首 push + 逐首刷新导致的多首导入卡顿
  added.forEach(a => state.songs.push(a.song));

  // 数据库写入并行进行（不是逐首 await），几十首也能一次写完
  added.forEach(a => {
    writes.push(dbPut(a.record).catch(e => console.log('保存到本地数据库失败:', e)));
  });

  if (added.length > 1) showMiniToast(`正在导入 ${added.length} 首…`);
  await Promise.all(writes);
  renderPlaylist();

  // 时长补读排队做（最多同时 2 个解码），导入多首时也不会卡界面
  enqueueDurationProbes(added);
  return added.length;
}

// 时长补读队列：并发上限 2
const durationProbeQueue = [];
let durationProbeRunning = 0;
function enqueueDurationProbes(pairs) {
  pairs.forEach(p => durationProbeQueue.push(p));
  pumpDurationProbe();
}
function pumpDurationProbe() {
  while (durationProbeRunning < 2 && durationProbeQueue.length > 0) {
    const p = durationProbeQueue.shift();
    durationProbeRunning++;
    probeNativeDuration(p.song, p.song.id, () => {
      durationProbeRunning--;
      pumpDurationProbe();
    });
  }
}

// 用临时 audio 读原生文件的时长，读到后更新数据库与列表
function probeNativeDuration(song, id, done) {
  const finish = () => { if (typeof done === 'function') done(); };
  const probe = new Audio();
  probe.preload = 'metadata';
  probe.src = toPlayableUrl(song.nativePath);
  probe.addEventListener('loadedmetadata', () => {
    const dur = probe.duration;
    if (!dur || isNaN(dur)) { finish(); return; }
    song.duration = dur;
    dbUpdateMeta(id, { duration: dur }).catch(() => {});
    renderPlaylist();
    finish();
  }, { once: true });
  probe.addEventListener('error', () => { finish(); }, { once: true });
}

function handleFolderFiles(e) {
  const files = getMusicFiles(Array.from(e.target.files));
  if (files.length === 0) {
    alert('所选文件夹中没有找到音乐文件\n支持格式：MP3、FLAC、WAV、AAC、OGG、M4A等');
    e.target.value = '';
    return;
  }
  showImportResult(files);
  e.target.value = '';
}

function handleFiles(e) {
  const raw = Array.from(e.target.files);
  if (raw.length === 0) {
    // 用户取消选择，静默返回
    e.target.value = '';
    return;
  }
  const files = getMusicFiles(raw);
  if (files.length === 0) {
    alert('所选文件中没有可识别的音乐\n支持格式：MP3、FLAC、WAV、AAC、OGG、M4A等');
    e.target.value = '';
    return;
  }
  showImportResult(files);
  e.target.value = '';
}

async function importFiles(files) {
  let failCount = 0;
  const tasks = files.map(async file => {
    let url = '';
    try {
      url = URL.createObjectURL(file);
    } catch (err) {
      failCount++;
      return;
    }
    const id = 'song-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
    const name = (file.name || '未命名').replace(/\.[^/.]+$/, '');
    const song = {
      id: id,
      name: name,
      artist: '',
      url: url,
      duration: 0,
      addedAt: Date.now(),
      isFav: false
    };
    state.songs.push(song);

    // 持久化：把音频 Blob 存入 IndexedDB
    try {
      await dbPut({
        id: id,
        name: name,
        artist: '',
        blob: file,
        type: file.type || '',
        duration: 0,
        addedAt: song.addedAt,
        isFav: false
      });
    } catch (e) {
      console.log('保存到本地数据库失败:', e);
    }

    const tempAudio = new Audio();
    tempAudio.src = url;
    const onFail = () => { tempAudio.removeEventListener('loadedmetadata', onOk); };
    const onOk = () => {
      song.duration = tempAudio.duration;
      tempAudio.removeEventListener('error', onFail);
      dbUpdateMeta(id, { duration: tempAudio.duration }).catch(() => {});
      renderPlaylist();
    };
    tempAudio.addEventListener('loadedmetadata', onOk);
    tempAudio.addEventListener('error', onFail);
  });
  await Promise.all(tasks);
  renderPlaylist();
  return failCount;
}

  const m = Object.create(null);
  const chars = Array.from(T2S_BLOB);
  for (let i = 0; i + 1 < chars.length; i += 2) m[chars[i]] = chars[i + 1];

})();

  let out = '';

}

let netKeysSeeded = false;
function seedNetShownKeys() {
  if (netKeysSeeded) return;
  netKeysSeeded = true;
  try {
    state.songs.filter(s => s.isNet).forEach(s => netShownKeys.add(netKey(s.name, s.artist)));
  } catch (e) {}
}
function netKey(name, artist) {
  const clean = (v) => (v || '')
    .replace(/[（(\[【].*?[）)\]】]/g, '')
    .replace(/[\s·、,，.。'"!！?？:：-]/g, '')
    .toLowerCase();
  const firstArtist = (artist || '').split(/[\/、,&]/)[0] || '';
  return t2s(clean(name)) + '|' + t2s(clean(firstArtist));
}

// 从本地曲库和收藏里提炼"个人喜好"
function getTasteSeeds() {
  const score = {};
  state.songs.filter(s => !s.isNet).forEach(s => {
    const a = (s.artist || '').trim();
    if (!a || a === '未知' || a === '未知歌手' || a === '<unknown>') return;
    score[a] = (score[a] || 0) + (s.isFav ? 3 : 1);
  });
  const artists = Object.keys(score).sort((x, y) => score[y] - score[x]).slice(0, 3);
  return { artists };
}

// iTunes 搜索接口（JSONP 方式，避开跨域限制）
// 说明：中国区曲库对中文歌搜索返回很少，优先用台湾/香港区，再退回美区
function itunesSearchJsonp(term, limit, country) {
  return new Promise((resolve, reject) => {
    const cb = 'itunes_cb_' + Math.random().toString(36).slice(2, 10);
    const script = document.createElement('script');
    let done = false;

    const timer = setTimeout(() => finish(new Error('请求超时')), 12000);

    function finish(err, data) {
      if (done) return;
      done = true;
      clearTimeout(timer);
      try { delete window[cb]; } catch (e) { window[cb] = undefined; }
      script.remove();
      if (err) reject(err); else resolve(data);
    }

    window[cb] = data => finish(null, (data && data.results) || []);
    script.onerror = () => finish(new Error('网络请求失败'));
    script.src = 'https://itunes.apple.com/search?term=' + encodeURIComponent(term) +
      '&media=music&entity=song&limit=' + (limit || 12) +
      '&country=' + (country || 'tw') + '&callback=' + cb;
    document.body.appendChild(script);
  });
}

// 依次尝试多个曲库地区，直到拿到结果
async function searchAcrossStores(term, limit) {
  const stores = ['tw', 'hk', 'us'];
  for (const c of stores) {
    try {
      const list = await itunesSearchJsonp(term, limit, c);
      if (list && list.length > 0) return list;
    } catch (e) {
      console.log('曲库搜索失败:', c, term, e && e.message);
    }
  }
  return [];
}

// App 内用原生 HTTP（不受跨域限制），浏览器内退回 fetch
async function httpJson(url, headers) {
  const plugins = (IS_NATIVE && window.Capacitor) ? window.Capacitor.Plugins : null;
  const nativeHttp = plugins && plugins.CapacitorHttp;
  if (nativeHttp && typeof nativeHttp.get === 'function') {
    const r = await nativeHttp.get({ url: url, headers: headers || {} });
    const d = r && r.data;
    return typeof d === 'string' ? JSON.parse(d) : d;
  }
  const resp = await fetch(url, { headers: headers || {} });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return await resp.json();
}

// 有些接口（酷我）返回的不是标准 JSON，需要按文本取回来自己解析
async function httpText(url, headers) {
  const plugins = (IS_NATIVE && window.Capacitor) ? window.Capacitor.Plugins : null;
  const nativeHttp = plugins && plugins.CapacitorHttp;
  if (nativeHttp && typeof nativeHttp.get === 'function') {
    const r = await nativeHttp.get({ url: url, headers: headers || {}, responseType: 'text' });
    const d = r && r.data;
    return typeof d === 'string' ? d : JSON.stringify(d);
  }
  const resp = await fetch(url, { headers: headers || {} });
  if (!resp.ok) throw new Error('HTTP ' + resp.status);
  return await resp.text();
}

// 酷狗取流签名：md5(hash + "kgcloud")，必须是带手机 UA 的 /i/ 老接口，/i/v2/ 用 kgcloudv2 会 Bad key
const KUGOU_HEADERS = { 'User-Agent': 'Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36', 'Referer': 'http://m.kugou.com/' };
function md5hex(str) {
  const k = [];
  let i;
  const h = [0x67452301, 0xefcdab89, 0x98badcfe, 0x10325476];
  for (i = 0; i < 64; i++) k[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) | 0;
  const s = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,
             5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,
             4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,
             6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  const bytes = [];
  str = unescape(encodeURIComponent(str));
  for (i = 0; i < str.length; i++) bytes.push(str.charCodeAt(i));
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (i = 0; i < 8; i++) bytes.push(Math.floor(bitLen / Math.pow(2, i * 8)) & 0xff);
  const words = [];
  for (i = 0; i < bytes.length; i += 4) {
    words.push(bytes[i] | (bytes[i+1] << 8) | (bytes[i+2] << 16) | (bytes[i+3] << 24));
  }
  const add = (a, b) => (a + b) & 0xffffffff;
  const rol = (x, c) => ((x << c) | (x >>> (32 - c))) & 0xffffffff;
  for (let w = 0; w < words.length; w += 16) {
    let a = h[0], b = h[1], c = h[2], d = h[3];
    for (i = 0; i < 64; i++) {
      let f, g;
      if (i < 16) { f = (b & c) | (~b & d); g = i; }
      else if (i < 32) { f = (d & b) | (~d & c); g = (5 * i + 1) % 16; }
      else if (i < 48) { f = b ^ c ^ d; g = (3 * i + 5) % 16; }
      else { f = c ^ (b | ~d); g = (7 * i) % 16; }
      const t = add(add(add(a, f | 0), k[i]), words[w + g] | 0);
      a = d; d = c; c = b;
      b = add(b, rol(t, s[i]));
    }
    h[0] = add(h[0], a); h[1] = add(h[1], b); h[2] = add(h[2], c); h[3] = add(h[3], d);
  }
  let hex = '';
  for (i = 0; i < 4; i++) {
    for (let j = 0; j < 4; j++) {
      const byte = (h[i] >>> (j * 8)) & 0xff;
      hex += ('0' + byte.toString(16)).slice(-2);
    }
  }
  return hex;
}

// "4分23秒" → 秒
function parseCnDuration(txt) {
  if (!txt) return 0;
  const m = /(\d+)\s*分\s*(\d+)\s*秒/.exec(txt);
  if (m) return Number(m[1]) * 60 + Number(m[2]);
  const n = Number(txt);
  return isNaN(n) ? 0 : n;
}

// 酷狗：hash 取流（免费曲目返回 http 地址，付费曲目返回 status 0，交给兜底链路）
async function kugouStream(hash) {
  const key = md5hex(hash + 'kgcloud');
  const d = await httpJson('http://trackercdn.kugou.com/i/?cmd=4&pid=2&behavior=play&hash=' + encodeURIComponent(hash) + '&key=' + key, KUGOU_HEADERS);
  if (d && d.status === 1 && d.url) {
    const u = Array.isArray(d.url) ? d.url[0] : d.url;
    if (u && /^https?:\/\//.test(u)) return u.replace(/^http:/, 'https:');
  }
  return '';
}

// QQ音乐：只取歌单信息，播放地址在播放时再换（接口已不再直接给可用地址）
async function searchQQ(term, want) {
  const d = await httpJson('https://api.vkeys.cn/v2/music/tencent?word=' + encodeURIComponent(term));
  const list = ((d && d.data) || []).slice(0, Math.max(want * 2, 6));
  const out = [];
  for (const it of list) {
    if (out.length >= want) break;
    const mid = it.mid || String(it.id || '');
    if (!mid) continue;
    let url = it.url || '';
    let cover = it.cover || '';
    let dur = parseCnDuration(it.interval);
    // 搜索接口偶尔会给真实地址，有就直接用；没有就留 qq: 占位串，播放时再解析
    if (url && !/^https?:\/\//.test(url)) url = '';
    out.push({
      id: 'net-qq-' + (it.id || mid),
      rkey: String(it.id || mid),
      qqMid: mid,
      name: it.song || '',
      artist: it.singer || '',
      artwork: cover ? cover.replace(/^http:/, 'https:') : '',
      duration: dur,
      url: url || ('qq:' + mid),
      source: 'qq',
      preview: !!(dur && dur < 100)
    });
  }
  return out;
}

// 酷狗：只取歌单信息（hash 留住），播放时再换流
async function searchKugou(term, want) {

    encodeURIComponent(term) + '&page=1&pagesize=' + Math.max(want * 2, 8), KUGOU_HEADERS);

}

// 网易云：官方搜索取歌单（曲库正版可播），播放时用公开通道换流
async function searchNetease(term, want) {
  let songs = [];
  try {
    const d = await httpJson('https://music.163.com/api/search/get/?s=' + encodeURIComponent(term) +
      '&type=1&limit=' + Math.max(want * 2, 6) + '&offset=0');
    songs = ((d && d.result && d.result.songs) || []).slice(0, Math.max(want * 2, 6));
  } catch (e) {
    // 浏览器里官方接口不给跨域头，改用允许跨域的公开通道（App 内走原生请求，不受影响）
    try {
      const d2 = await httpJson('https://music-api.gdstudio.xyz/api.php?types=search&source=netease&name=' +
        encodeURIComponent(term) + '&count=' + Math.max(want * 2, 6));
      songs = (Array.isArray(d2) ? d2 : []).map(it => ({
        id: it.id,
        name: it.name,
        artists: (it.artist || []).map(n => ({ name: n })),
        duration: 0
      }));
    } catch (e2) {}
  }
  const out = [];
  for (const it of songs) {
    if (out.length >= want) break;
    if (!it.id || !it.name) continue;
    const artists = (it.artists || []).map(a => a.name).filter(Boolean).join('/');
    out.push({
      id: 'net-163-' + it.id,
      rkey: String(it.id),
      name: it.name,
      artist: artists,
      artwork: '',
      duration: it.duration ? Math.round(it.duration / 1000) : 0,
      url: 'netease:' + it.id,
      source: 'netease',
      preview: false
    });
  }
  return out;
}

// 咪咕音乐：用咪咕的歌单搜索拿到曲目信息，播放地址再用同名同歌手在可播源里补流
const miguBridgeCache = new Map();
async function searchMigu(term, want) {
  let list = [];
  try {
    const d = await httpJson('https://app.c.nf.migu.cn/MIGUM2.0/v1.0/content/search_all.do?text=' +
      encodeURIComponent(term) + '&pageNo=1&pageSize=' + (want * 3) + '&searchSwitch=' + encodeURIComponent('{"song":1}'));
    const sr = (d && d.songResultData) || {};
    list = Array.isArray(sr.result) ? sr.result : [];
  } catch (e) {
    return [];
  }
  if (!list.length) return [];

  const items = list.slice(0, want * 2).map(it => {
    const singers = (it.singers || []).map(x => x.name).filter(Boolean).join('/');
    const imgs = it.imgItems || [];
    const cover = (imgs.find(x => x.imgSizeType === '02') || imgs[0] || {}).img || '';
    return {
      cid: it.contentId || it.copyrightId || it.id,
      name: it.name || '',
      artist: singers,
      artwork: cover
    };
  }).filter(x => x.name && x.cid);

  // 并发去可播源补流（拿不到的直接丢弃），同名同歌手结果缓存复用
  const resolved = await Promise.all(items.map(async (x) => {
    const ck = x.name + '|' + x.artist;
    if (miguBridgeCache.has(ck)) return miguBridgeCache.get(ck);
    try {
      const hits = await searchQQ(x.name + (x.artist ? ' ' + x.artist.split('/')[0] : ''), 1);
      const hit = hits && hits[0];
      if (!hit || !hit.url) return null;
      return {
        id: 'net-mg-' + x.cid,
        cid: String(x.cid),
        rkey: hit.rkey,
        rkeyKind: 'qq',
        name: x.name,
        artist: x.artist || hit.artist || '',
        artwork: x.artwork || hit.artwork || '',
        duration: hit.duration || 0,
        url: hit.url,
        source: 'migu',
        preview: !!hit.preview
      };
    } catch (e) {
      return null;
    }
  }));

  resolved.forEach((v, i) => { if (v) miguBridgeCache.set(items[i].name + '|' + items[i].artist, v); });
  return resolved.filter(Boolean).slice(0, want);
}

// 酷我音乐：官方搜索接口返回单引号伪 JSON，逐条抠字段；播放地址用 anti.s 换真实 mp3
const KUWO_HEADERS = { 'User-Agent': 'Mozilla/5.0 (Linux; Android 10) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36', 'Referer': 'http://www.kuwo.cn/' };

function decodeEntities(str) {
  return (str || '')
    .replace(/&nbsp;/g, ' ')
    .replace(/&amp;/g, '&')
    .replace(/&quot;/g, '"')
    .replace(/&#39;/g, "'")
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    // 酷我会返回 \\u0026 这类未解析的转义
    .replace(/\\\\+u([0-9a-fA-F]{4})/g, (m, h) => String.fromCharCode(parseInt(h, 16)))
    .trim();
}

// 在某个 key 之前最近一次出现的值（酷我记录里 NAME/ARTIST 都在 MUSICRID 前面）
function kuwoField(txt, idx, key) {
  const pat = "'" + key + "':'";
  const p = txt.lastIndexOf(pat, idx);
  if (p < 0) return '';
  const start = p + pat.length;
  const end = txt.indexOf("'", start);
  if (end < 0) return '';
  return decodeEntities(txt.slice(start, end));
}

function parseKuwoList(txt, want) {
  const out = [];
  const re = /'MUSICRID':'MUSIC_(\d+)'/g;
  let m;
  while ((m = re.exec(txt)) && out.length < want) {
    const rid = m[1];
    const idx = m.index;
    const name = kuwoField(txt, idx, 'NAME') || kuwoField(txt, idx, 'SONGNAME');
    if (!name) continue;
    const artist = kuwoField(txt, idx, 'ARTIST');
    const dur = parseFloat(kuwoField(txt, idx, 'DURATION')) || 0;
    out.push({
      id: 'net-kw-' + rid,
      kuwoRid: 'MUSIC_' + rid,
      name: name,
      artist: artist,
      artwork: '',
      duration: dur,
      url: 'kuwo:MUSIC_' + rid,
      source: 'kuwo',
      preview: false
    });
  }
  return out;
}

async function searchKuwo(term, want) {
  const url = 'http://search.kuwo.cn/r.s?all=' + encodeURIComponent(term)
    + '&ft=music&itemset=web_2013&client=kt&pn=0&rn=' + Math.max(10, want * 3)
    + '&rformat=json&encoding=utf8';
  let txt = '';
  try {
    txt = await httpText(url, KUWO_HEADERS);
  } catch (e) {
    return [];
  }
  return parseKuwoList(txt, want);
}

// QQ：官方 vkey 接口，免费曲目可直出，VIP 曲目 purl 为空（交给兜底）
async function qqStream(mid) {
  if (!mid) return '';
  try {
    const data = { req_0: { module: 'vkey.GetVkeyServer', method: 'CgiGetVkey', param: { guid: '10000', songmid: [mid], songtype: [0], uin: '0', loginflag: 1, platform: '20' } } };
    const d = await httpJson('https://u.y.qq.com/cgi-bin/musicu.fcg?data=' + encodeURIComponent(JSON.stringify(data)), { 'User-Agent': KUWO_HEADERS['User-Agent'], 'Referer': 'https://y.qq.com/' });
    const r0 = d && d.req_0 && d.req_0.data;
    const info = (r0 && r0.midurlinfo && r0.midurlinfo[0]) || {};
    if (!info.purl) return '';
    const sip = (r0.sip && r0.sip[0]) || 'http://aqqmusic.tc.qq.com/';
    const u = sip + info.purl;
    if (/^https?:\/\//.test(u)) return u.replace(/^http:/, 'https:');
  } catch (e) {}
  return '';
}

// 同名（忽略繁简/括号/标点）判定，用于全网找同曲时校验
function nameLooseEq(a, b) {
  const na = netKey(a, '').split('|')[0];
  const nb = netKey(b, '').split('|')[0];
  if (!na || !nb) return false;
  if (na === nb) return true;
  if (na.length < 2 || nb.length < 2) return false;
  return na.indexOf(nb) >= 0 || nb.indexOf(na) >= 0;
}

// 歌手校验：两边都有歌手时必须有一边包含另一边，避免兜底成同名翻唱片段
function artistLooseEq(a, b) {
  const na = netKey('', a).split('|')[1];
  const nb = netKey('', b).split('|')[1];
  if (!na || !nb) return true;
  return na.indexOf(nb) >= 0 || nb.indexOf(na) >= 0;
}

// 判定是不是同一首歌
function sameSong(nm, firstArtist, cand) {
  if (!cand || !nameLooseEq(nm, cand.name)) return false;
  return artistLooseEq(firstArtist, cand.artist);
}

// 全网兜底：原音源放不出来时，用「歌名 / 歌名+歌手」去各家找同曲，找到就播
const streamBridgeCache = new Map();

// 多家并行，谁先拿到可播地址就用谁，超时就不等了
function firstHit(promises, ms) {
  return new Promise((resolve) => {
    let left = promises.length;
    let done = false;
    const timer = setTimeout(() => { if (!done) { done = true; resolve(''); } }, ms);
    if (!left) { clearTimeout(timer); return resolve(''); }
    promises.forEach(p => {
      Promise.resolve(p).then(u => {
        if (done) return;
        if (u) { done = true; clearTimeout(timer); resolve(u); return; }
        if (--left === 0) { done = true; clearTimeout(timer); resolve(''); }
      }).catch(() => {
        if (done) return;
        if (--left === 0) { done = true; clearTimeout(timer); resolve(''); }
      });
    });
  });
}

async function bridgeStream(name, artist) {
  const nm = (name || '').trim();
  const first = ((artist || '').split(/[\/、,&]/)[0] || '').trim();
  if (!nm) return '';
  const cacheKey = netKey(name, artist);
  const hit = streamBridgeCache.get(cacheKey);
  if (hit && Date.now() - hit.at < 1800000) return hit.url;
  const remember = (u) => { if (u) streamBridgeCache.set(cacheKey, { url: u, at: Date.now() }); return u; };

  // 两种检索词：先"歌名 歌手"（准），再只用"歌名"（广）
  const queries = [];
  if (first) queries.push(nm + ' ' + first);
  if (!queries.includes(nm)) queries.push(nm);

  // 四家取流通道并行跑（酷我/咪咕在这里只当播放通道，不在列表里露出）
  const providers = [
    {
      label: '酷我',
      async run(kw, strictArtist) {
        const list = await searchKuwo(kw, 3);
        for (const k of list) {
          if (strictArtist ? !sameSong(nm, first, k) : !nameLooseEq(nm, k.name)) continue;
          const u = await kuwoAnti(k.kuwoRid || String(k.url || '').replace('kuwo:', ''));
          if (u) return u;
        }
        return '';
      }
    },
    {
      label: '网易云',
      async run(kw, strictArtist) {
        const list = await searchNetease(kw, 3);
        for (const n of list) {
          if (strictArtist ? !sameSong(nm, first, n) : !nameLooseEq(nm, n.name)) continue;
          const u = await neteaseStreamById(n.rkey);
          if (u) return u;
        }
        return '';
      }
    },
    {
      label: '酷狗',
      async run(kw, strictArtist) {
        const list = await searchKugou(kw, 3);
        for (const g of list) {
          if (strictArtist ? !sameSong(nm, first, g) : !nameLooseEq(nm, g.name)) continue;
          const u = await kugouStream(g.rkey);
          if (u) return u;
        }
        return '';
      }
    },
    {
      label: 'QQ',
      async run(kw, strictArtist) {
        const list = await searchQQ(kw, 3);
        for (const q of list) {
          if (strictArtist ? !sameSong(nm, first, q) : !nameLooseEq(nm, q.name)) continue;
          const u = await qqStream(String(q.qqMid || q.rkey || ''));
          if (u) return u;
        }
        return '';
      }
    }
  ];

  // 先用严格条件（歌名 + 歌手）并行找；找不到再放宽到只校验歌名
  for (let i = 0; i < queries.length; i++) {
    const kw = queries[i];
    const strictArtist = i === 0;
    const u = await firstHit(providers.map(p => p.run(kw, strictArtist).catch(() => '')), 9000);
    if (u) {
      console.log('全网兜底命中:', nm, '←', kw, strictArtist ? '(严格)' : '(宽松)');
      return remember(u);
    }
  }
  return '';
}

// 播放前解析网络歌地址：地址过期、占位串、付费曲目都会在这里换成真正能播的地址
async function resolveNetUrl(song, force) {
  if (!song || !song.isNet) return song && song.url;
  const cur = song.url || '';
  const isReal = /^https?:\/\//.test(cur) && !/^(qq|kuwo|netease|kugou):/.test(cur);
  const isFresh = song._urlAt && (Date.now() - song._urlAt < 1200000);
  if (isReal && (song.downloaded || (!force && isFresh))) return cur;

  // force 表示上一个地址已经播不出来了：先直接全网找同曲，别再去撞同一个坏地址
  if (force) {
    const b = await bridgeStream(song.name, song.artist);
    if (b && b !== cur) {
      song._blobUrl = null;
      song.url = b;
      song.previewUrl = b;
      song._urlAt = Date.now();
      song._bridged = true;
      return b;
    }
    // 兜底又拿回同一个坏地址 → 清掉缓存，后面按本音源通道再试一次就放弃
    if (b && b === cur) streamBridgeCache.delete(netKey(song.name, song.artist));
  }

  let u = '';
  const src = song.source;
  try {
    if (src === 'kuwo' || cur.indexOf('kuwo:') === 0) {
      u = await kuwoAnti(String(song.kuwoRid || cur.replace('kuwo:', '')));
    } else if (src === 'netease' || cur.indexOf('netease:') === 0) {
      u = await neteaseStreamById(String(song.rkey || cur.replace('netease:', '')));
    } else if (src === 'kugou' || (src === 'qishui' && song.rkeyKind === 'kugou') || cur.indexOf('kugou:') === 0) {
      u = await kugouStream(String(song.rkey || cur.replace('kugou:', '')));
    } else if (src === 'qq' || (src === 'qishui' && song.rkeyKind === 'qq') || cur.indexOf('qq:') === 0) {
      u = await qqStream(String(song.qqMid || song.rkey || cur.replace('qq:', '')));
    } else if (src === 'douyin') {
      u = (await kugouStream(String(song.rkey || ''))) || (await qqStream(String(song.qqMid || '')));
    }
  } catch (e) {
    console.log('本音源取流失败:', e && e.message);
  }
  // 真实地址没过期就先用它
  if (!u && isReal) u = cur;
  // 还是没拿到可播地址 → 全网搜同曲兜底
  if (!u) {
    u = await bridgeStream(song.name, song.artist);
    if (u) song._bridged = true;
  } else {
    song._bridged = false;
  }
  if (u) {
    if (u !== cur) song._blobUrl = null;
    song.url = u;
    song.previewUrl = u;
    song._urlAt = Date.now();
  }
  return u || '';
}

     '许嵩', '五月天', '周深', '孙燕姿', '王菲', '张学友']
      .forEach(t => pool.push(t));

    seedNetShownKeys();

    const existedIds = new Set(state.songs.filter(s => s.isNet).map(s => s.id));
    const seen = new Set();
    const fresh = [];

    const takeResults = (results) => {
      results.forEach(t => {
        if (!t || !t.name || !t.url) return;
        const key = netKey(t.name, t.artist);
        if (existedIds.has(t.id) || seen.has(key) || netShownKeys.has(key)) return;
        seen.add(key);
        fresh.push(Object.assign({}, t, {
          previewUrl: t.url,
          addedAt: Date.now(),
          isFav: false,
          isNet: true,
          downloaded: false,
          _urlAt: Date.now()
        }));
      });
    };

    // 关键词一共有 30 多个，这批凑不够新歌就自动换下一组词再搜，最多试 4 轮
    for (let attempt = 0; attempt < 4 && fresh.length < 12; attempt++) {
      const pick = i => pool[(netRecRound * 3 + i) % pool.length];
      const tA = pick(0), tB = pick(1), tC = pick(2);
      const tDy = ['抖音热歌', '抖音热门BGM', '网络热歌', '热门翻唱'][netRecRound % 4];
      netRecRound++;

      // 四家音源并行搜索，谁快谁先到，慢的或失败的自动跳过
      const settled = await Promise.allSettled([
        searchQQ(tA, 8),
        searchKugou(tB, 6),
        searchNetease(tC, 5),
        searchQishui(tB, 4)
      ]);

      let results = [];
      settled.forEach(r => {
        if (r.status === 'fulfilled' && Array.isArray(r.value)) results = results.concat(r.value);
      });

      if (results.length === 0 && attempt === 0) throw new Error('没有获取到推荐，请检查网络连接');
      takeResults(results);
    }

    if (fresh.length === 0) {
      throw new Error('这批曲库都翻过了，过一会儿再点「换一批」');
    }

    // 试听课最多留 3 条，其余先尝试换成完整版（换不到就丢掉）
    const previewItems = fresh.filter(x => x.preview);
    if (previewItems.length > 0) {
      const upgraded = await Promise.all(previewItems.slice(0, 5).map(upgradePreviewToFull));
      upgraded.forEach((u, i) => {
        const idx = fresh.indexOf(previewItems[i]);
        if (u && !u.preview && idx >= 0) fresh[idx] = Object.assign(u, {
          previewUrl: u.url, addedAt: Date.now(), isFav: false, isNet: true, downloaded: false, _urlAt: Date.now()
        });
      });
    }

    // 各音源交替排列，列表看起来更匀
    const bySource = {};
    fresh.forEach(s => { (bySource[s.source] = bySource[s.source] || []).push(s); });
    const mixed = [];
    const keys = Object.keys(bySource);
    let added = true;
    while (added) {
      added = false;
      keys.forEach(k => {
        if (bySource[k].length) { mixed.push(bySource[k].shift()); added = true; }
      });
    }
    let previewLeft = 3;
    const finalBatch = mixed.filter(x => {
      if (!x.preview) return true;
      if (previewLeft <= 0) return false;
      previewLeft--;
      return true;
    }).slice(0, 30);

    state.songs.push(...finalBatch);
    finalBatch.forEach(s2 => netShownKeys.add(netKey(s2.name, s2.artist)));
    saveNetMeta();

    const usedSrc = [...new Set(finalBatch.map(s => SOURCE_LABEL[s.source] || '网络'))];
    const tag = usedSrc.join('/');
    netRecText = (seeds.artists.length > 0 ? '按你的口味（' + seeds.artists.join('、') + '）' : '暂无收藏，先给你挑热门')
      + ' · 来自 ' + tag;
  } catch (e) {
    netRecError = (e && e.message) || '获取推荐失败';
    // 列表里已经有歌时，用轻提示告知，不打断当前歌单
    if (state.songs.some(s => s.isNet)) showImportNotice(netRecError);
  } finally {
    netRecLoading = false;
    renderPlaylist();
  }
}

// 播放网络歌曲前自动匹配歌词
function parseLrcText(text) {
  const lines = [];
  (text || '').split('\n').forEach(line => {
    const match = line.match(/\[(\d+):(\d+)(?:\.(\d+))?\](.*)/);
    if (match) {
      const min = parseInt(match[1], 10);
      const sec = parseInt(match[2], 10);
      const txt = (match[4] || '').trim();
      if (txt) lines.push({ time: min * 60 + sec, text: txt });
    }
  });
  return lines;
}

async function loadNetLyrics(song) {
  currentLyrics = [];
  try {
    const keyword = (song.name + ' ' + (song.artist || '')).trim();
    const res = await fetch('https://lrclib.net/api/search?q=' + encodeURIComponent(keyword));
    if (res.ok) {
      const data = await res.json();
      const hit = (data || []).find(x => x.syncedLyrics);
      if (hit) {
        const parsed = parseLrcText(hit.syncedLyrics);
        if (parsed.length > 0) {
          currentLyrics = parsed;
          renderLyrics();
          return;
        }
      }
    }
  } catch (e) {
    console.log('在线歌词匹配失败:', e && e.message);
  }
  generateLyrics(song.name);
}

// 下载音频：App 内走原生 HTTP（绕开跨域），浏览器走 fetch
async function fetchAudioBlob(url) {
  const plugins = (IS_NATIVE && window.Capacitor) ? window.Capacitor.Plugins : null;
  const nativeHttp = plugins ? plugins.CapacitorHttp : null;

  if (nativeHttp && typeof nativeHttp.get === 'function') {
    try {
      const r = await nativeHttp.get({ url: url, responseType: 'arraybuffer' });
      const data = r && r.data;
      if (typeof data === 'string' && data.length > 0) {
        const bin = atob(data);
        const arr = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
        const type = (r.headers && (r.headers['content-type'] || r.headers['Content-Type'])) || 'audio/mp4';
        return new Blob([arr], { type: type });
      }
    } catch (e) {
      console.log('原生下载失败，改用 fetch:', e && e.message);
    }
  }

  const resp = await fetch(url);
  if (!resp.ok) throw new Error('下载请求失败 HTTP ' + resp.status);
  return await resp.blob();
}

async function downloadNetSong(id, ev) {
  if (ev) { ev.stopPropagation(); ev.preventDefault(); }
  const song = state.songs.find(s => s.id == id);
  if (!song || !song.isNet || song.downloaded || song._downloading) return;

  song._downloading = true;
  renderPlaylist();

  try {
    const src = await resolveNetUrl(song) || song.previewUrl || song.url;
    if (!/^https?:\/\//.test(String(src || ''))) throw new Error('缺少可用的音频地址');
    const blob = await fetchAudioBlob(src);
    if (!blob || blob.size < 1024) throw new Error('下载内容为空');

    await dbPut({
      id: song.id,
      name: song.name,
      artist: song.artist,
      blob: blob,
      type: blob.type || 'audio/mp4',
      duration: song.duration || 0,
      addedAt: song.addedAt || Date.now(),
      isFav: !!song.isFav,
      isNet: true,
      previewUrl: song.previewUrl,
      artwork: song.artwork
    });

    const oldUrl = song.url;
    song.url = URL.createObjectURL(blob);
    if (oldUrl && oldUrl.startsWith('blob:')) URL.revokeObjectURL(oldUrl);
    if (song._blobUrl) { try { URL.revokeObjectURL(song._blobUrl); } catch (e) {} song._blobUrl = null; }
    song._blobPromise = null;
    song.downloaded = true;
    saveNetMeta();

    // 正在播放这首歌时，切到本地文件继续播
    if (state.songs[state.currentIndex] && state.songs[state.currentIndex].id === song.id) {
      const pos = audio.currentTime;
      const wasPlaying = !audio.paused;
      audio.src = song.url;
      if (wasPlaying) {
        audio.play().then(() => { audio.currentTime = pos; }).catch(() => {});
      }
    }

    showImportNotice('已下载，可离线播放');
  } catch (e) {
    alert('下载失败：' + ((e && e.message) || '网络异常') + '\n请检查网络连接后重试');
  } finally {
    song._downloading = false;
    renderPlaylist();
    updateFsDownloadBtn();
  }
}

// ===== 渲染播放列表 =====
function getFilteredSongs() {
  let list = [...state.songs];

  // 搜索结果：本地歌曲优先，其后是网络歌曲
  if (state.searchQuery) {
    const q = state.searchQuery.toLowerCase();
    const hit = s => (s.name || '').toLowerCase().includes(q) || (s.artist || '').toLowerCase().includes(q);
    const local = list.filter(s => !s.isNet && hit(s)).sort((a, b) => b.addedAt - a.addedAt);
    const net = list.filter(s => s.isNet && hit(s)).sort((a, b) => b.addedAt - a.addedAt);
    return local.concat(net);
  }

  // 榜单：只显示当前榜单的十首
  if (state.currentView === 'net') {
    if (state.netChart) {
      return list.filter(s => s.isNet && s.chart === state.netChart)
        .sort((a, b) => b.addedAt - a.addedAt)
        .slice(0, 10);
    }
    // 网络推荐主列表只留五首（最新的五首）
    return list.filter(s => s.isNet && !s.chart && !s.searchHit)
      .sort((a, b) => b.addedAt - a.addedAt)
      .slice(0, 5);
  }
  if (state.currentView === 'favorites') {
    list = list.filter(s => s.isFav);
  } else {
    // 本地歌曲：本机导入的 + 已下载（缓存）的网络歌曲
    list = list.filter(s => !s.isNet || s.downloaded);
  }
  if (state.sortBy === 'added') {
    list.sort((a, b) => b.addedAt - a.addedAt);
  } else {
    list.sort((a, b) => a.name.localeCompare(b.name, 'zh'));
  }
  return list;
}

// 单次请求超时保护：慢的音源直接跳过，不拖累整榜
function withTimeout(promise, ms, fallback) {
  return new Promise((resolve) => {
    let done = false;
    const t = setTimeout(() => { if (!done) { done = true; resolve(fallback); } }, ms);
    Promise.resolve(promise).then(v => {
      if (done) return;
      done = true; clearTimeout(t); resolve(v);
    }, () => {
      if (done) return;
      done = true; clearTimeout(t); resolve(fallback);
    });
  });
}

  '熱門歌曲', '熱歌', '熱歌榜', '飆升', '新歌推薦', '熱門',
  '最新歌曲', '推荐歌曲', '熱門推薦', '热门推荐', '好听歌曲', '好聽歌曲',
  '流行歌曲', '华语好歌', '華語好歌', '宝藏歌曲', '寶藏歌曲', '小众歌曲',
  '华语新歌', '華語新歌', '新歌首播', '新歌推薦', '治愈歌曲', '经典好歌', '經典好歌',
  '经典热歌', '流行热歌'];

function isChartJunk(t) {
  if (!t || !t.name) return true;
  const nm = t.name.trim();
  const core = nm.replace(/[（(\[].*?[）)\]]/g, '').trim();
  if (CHART_JUNK_NAMES.includes(nm) || CHART_JUNK_NAMES.includes(core) || nm.length <= 1) return true;
  if (nm.length > 26) return true;
  if (/(DJ|dj|Mixtape|MIXTAPE|串烧|车载|快手|伴奏|KTV|ktv|铃声|片段|翻自)/.test(nm)) return true;
  return false;
}

// 单个音源的请求（各自独立，谁先回来谁先入池，单家最多等 1.8 秒）
// 音源只保留四家：QQ音乐、网易云、汽水、酷狗
function chartSourceTask(term, src) {
  switch (src) {
    case 'qq':      return withTimeout(searchQQ(term, 8), 1800, []);
    case 'kugou':   return withTimeout(searchKugou(term, 6), 1800, []);
    case 'netease': return withTimeout(searchNetease(term, 5), 1800, []);
    case 'qishui':  return withTimeout(searchQishui(term, 5), 1800, []);
  }
  return null;
}

// 一个关键词的所有音源请求：六个榜单统一只用 QQ、网易云、汽水、酷狗
function chartSources(term, mode) {
  return CHART_SOURCES.map(s => chartSourceTask(term, s)).filter(Boolean);
}

// 并行收集候选：谁先到谁先进池，够 enough 首立刻返回，剩下的继续后台补池
function collectChartPool(mode, terms, pool, seen, inOtherCharts, enough, deadline, strict) {
  return new Promise((resolve) => {
    const tasks = [];
    terms.forEach(term => chartSources(term, mode).forEach(p => tasks.push(p)));
    if (!tasks.length) return resolve();
    let pending = tasks.length;
    let done = false;
    const finish = () => {
      if (done) return;
      done = true;
      clearTimeout(timer);
      resolve();
    };
    const timer = setTimeout(finish, deadline);
    const eat = (results) => {
      for (const t of results) {
        if (pool.length >= 60) break;
        if (isChartJunk(t) || !t.url) continue;
        const key = (t.name || '').trim().toLowerCase();
        if (seen.has(key) || inOtherCharts.has(key)) continue;
        if (strict !== false && netShownKeys.has(netKey(t.name, t.artist))) continue;
        seen.add(key);
        pool.push(t);
      }
      if (pool.length >= enough) finish();
    };
    tasks.forEach((p) => {
      Promise.resolve(p).then((rs) => {
        eat(rs);       // 已出榜也继续补池，换一批时直接复用
        if (--pending === 0) finish();
      }, () => { if (--pending === 0) finish(); });
    });
  });
}

// 组一个榜单的候选池：够一批马上出榜（通常 1 秒内），凑不够再补两个关键词
async function buildChartPool(mode, meta, inOtherCharts, strict) {
  const pool = [];
  const seen = new Set();
  const terms = meta.terms;
  const need = meta.batch || 10;
  await collectChartPool(mode, terms.slice(0, 3), pool, seen, inOtherCharts, need, 1500, strict);
  if (pool.length < need && terms.length > 3) {
    await collectChartPool(mode, terms.slice(3), pool, seen, inOtherCharts, need, 1800, strict);
  }
  return { pool, seen };
}

// 抓一个榜单：前 20（排行榜/飙升榜/新歌榜）或前 10（其余榜）
async function fetchChart(mode) {
  if (chartLoading) return;
  chartLoading = mode;
  renderPlaylist();
  try {
    const meta = CHART_META[mode];
    const batchSize = meta.batch || 10;
    seedNetShownKeys();
    const inOtherCharts = new Set(state.songs
      .filter(s => s.isNet && s.chart && s.chart !== mode)
      .map(s => ((s.name || '').trim() + '|' + (s.artist || '').trim()).toLowerCase()));

    let cache = chartPoolCache[mode];
    const expired = !cache || (Date.now() - cache.at > CHART_POOL_TTL);
    const remaining = cache ? cache.pool.length - cache.used : 0;

    // 池子里不够一批（或过期）才重新打网络
    if (expired || remaining < batchSize) {
      let built = await buildChartPool(mode, meta, inOtherCharts, true);
      // 新歌搜不出来了（该榜的曲库都被翻过）就放宽历史限制，保证榜能填满
      if (built.pool.length < batchSize) built = await buildChartPool(mode, meta, inOtherCharts, false);
      if (!built.pool.length) throw new Error('这个榜单暂时没取到歌，再点一次试试');
      cache = chartPoolCache[mode] = { pool: built.pool, seen: built.seen, used: 0, at: Date.now() };
    }

    // 整曲优先，30 秒试听排到后面，别一屏都是试听
    cache.pool.sort((a, b) => (a.preview ? 1 : 0) - (b.preview ? 1 : 0));
    const raw = cache.pool.slice(cache.used, cache.used + batchSize);
    cache.used += raw.length;
    // 30 秒试听按批次比例限量，其余位置直接用整曲
    let prevLeft = Math.max(2, Math.round(batchSize / 10));
    const picked = raw.filter((x) => {
      if (!x.preview) return true;
      if (prevLeft <= 0) return false;
      prevLeft--;
      return true;
    });
    chartRound[mode]++;

    const fresh = picked.map((t, i) => Object.assign({}, t, {
      id: t.id + '-c-' + mode,
      previewUrl: t.url,
      addedAt: Date.now() + i,
      isFav: false,
      isNet: true,
      downloaded: false,
      chart: mode,
      _urlAt: Date.now()
    }));

    // 清掉该榜单旧歌，换成新的一批
    state.songs = state.songs.filter(s => !(s.isNet && s.chart === mode));
    state.songs.push(...fresh);
    fresh.forEach(s2 => netShownKeys.add(netKey(s2.name, s2.artist)));
    saveNetMeta();

    // 后台悄悄把剩下的关键词补进池子，这样下一次"换一批"就不用再等网络
    const topCache = cache;
    if (topCache.pool.length < batchSize * 2 && meta.terms.length > 3) {
      setTimeout(() => {
        if (chartPoolCache[mode] !== topCache) return;
        collectChartPool(mode, meta.terms.slice(3), topCache.pool, topCache.seen, inOtherCharts, batchSize + 10, 3000);
      }, 600);
    }
  } catch (e) {
    showImportNotice((e && e.message) || '榜单获取失败');
  } finally {
    chartLoading = null;
    renderPlaylist();
  }
}

// ===== 搜索 =====
let searchLoading = false;

function doSongSearch() {
  const input = document.getElementById('songSearchInput');
  const q = (input && input.value || '').trim();
  if (!q) { clearSongSearch(); return; }
  state.searchQuery = q;
  state.netChart = null;
  const clearBtn = document.getElementById('searchClearBtn');
  if (clearBtn) clearBtn.style.display = 'block';
  renderPlaylist();
  searchOnlineFor(q);
}

function clearSongSearch() {
  state.searchQuery = '';
  const input = document.getElementById('songSearchInput');
  if (input) input.value = '';
  const clearBtn = document.getElementById('searchClearBtn');
  if (clearBtn) clearBtn.style.display = 'none';
  renderPlaylist();
}

// 本地没有或不够时，联网把网络歌曲也搜出来
async function searchOnlineFor(q) {
  if (searchLoading) return;
  searchLoading = true;
  try {
    const settled = await Promise.allSettled([
      searchQQ(q, 6),
      searchKugou(q, 4),
      searchNetease(q, 4),
      searchQishui(q, 3)
    ]);
    let results = [];
    settled.forEach(r => {
      if (r.status === 'fulfilled' && Array.isArray(r.value)) results = results.concat(r.value);
    });

    const existed = new Set(state.songs.map(s => s.name + '|' + s.artist));
    let added = 0;
    results.forEach(t => {
      if (!t || !t.name || !t.url) return;
      const key = t.name + '|' + t.artist;
      if (existed.has(key)) return;
      existed.add(key);
      state.songs.push(Object.assign({}, t, {
        previewUrl: t.url,
        addedAt: Date.now(),
        isFav: false,
        isNet: true,
        downloaded: false,
        searchHit: true,
        _urlAt: Date.now()
      }));
      added++;
    });
    if (added > 0) saveNetMeta();
  } catch (e) {
    console.log('联网搜索失败:', e && e.message);
  } finally {
    searchLoading = false;
    if (state.searchQuery === q) renderPlaylist();
  }
}

  if (state.searchQuery) {
    renderSearchView(container);

  if (state.currentView === 'net') {

  }

  const list = getFilteredSongs();

  if (list.length === 0) {

      <div class="empty-state">

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatTime(sec) {
  if (!sec || isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

// 轻量提示（网络歌取流需要一点时间）
function showMiniToast(text) {
  let el = document.getElementById('miniToast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'miniToast';
    el.style.cssText = 'position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(20,20,24,.92);color:#e8c547;font-size:13px;padding:8px 16px;border-radius:999px;z-index:9999;pointer-events:none;opacity:0;transition:opacity .25s;';
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 2500);
}

// ===== 播放控制 =====
function playSongById(id) {
  const idx = state.songs.findIndex(s => s.id == id);
  if (idx === -1) return;
  state.currentIndex = idx;
  loadAndPlay();
}

// 网络音频先取成本地 Blob 再播：跨域音频直接接进 WebAudio 会被判静音，转成同源 Blob 才有声音
async function netBlobUrl(song) {
  if (song._blobUrl) return song._blobUrl;
  if (song._blobPromise) return song._blobPromise;
  song._blobPromise = (async () => {
    const blob = await fetchAudioBlob(song.url);
    if (!blob || blob.size < 1024) throw new Error('音频内容为空');
    song._blobUrl = URL.createObjectURL(blob);
    return song._blobUrl;
  })().catch((e) => { song._blobPromise = null; throw e; });
  return song._blobPromise;
}

// 取不到播放地址时跳过这首，连续失败三次就先停下，避免一整屏都播不出去还在狂跳
let brokenSkipAt = 0;
let brokenSkipStreak = 0;
function skipBrokenSong() {
  const now = Date.now();
  if (now - brokenSkipAt < 1500) return;
  brokenSkipAt = now;
  brokenSkipStreak++;
  if (brokenSkipStreak > 3) {
    brokenSkipStreak = 0;
    showMiniToast('网络不太好，换一批歌试试');
    return;
  }
  setTimeout(() => nextSong(), 400);
}

// 音频要出声必须先让 AudioContext 处于 running：频谱链路一旦接管了 audio 元素，
// 上下文挂起时声音会被一起挂掉（进度照常在走，就是没声）
function ensureAudioContextRunning() {
  const ctx = state.audioContext;
  if (!ctx) return Promise.resolve();
  try {
    if (ctx.state === 'suspended' || ctx.state === 'interrupted') {
      return Promise.resolve(ctx.resume()).catch(() => {});
    }
  } catch (e) {}
  return Promise.resolve();
}
audio.addEventListener('play', () => { ensureAudioContextRunning(); });

// 统一的播放入口：不设置 crossOrigin（音源 CDN 多不回 CORS 头），网络歌走同源 Blob
function playAudioUrl(url) {
  audio.crossOrigin = null;
  ensureAudioContextRunning();
  audio.src = url;
  const p = audio.play();
  if (p && p.catch) p.catch(err => console.log('播放失败:', err && err.message));
}

// 网络歌一律先抓成同源 Blob 再播：跨域媒体接进 WebAudio 会被判静音
function playNetBlob(song, attempt) {
  netBlobUrl(song).then((url) => {
    if (!state.songs[state.currentIndex] || state.songs[state.currentIndex].id !== song.id) return;
    playAudioUrl(url);
  }).catch(async (err) => {
    console.log('网络音频加载失败:', err && err.message, 'attempt=', attempt);
    if (!state.songs[state.currentIndex] || state.songs[state.currentIndex].id !== song.id) return;
    if (attempt < 2) {
      // 地址可能过期，重取一次再抓
      song._blobUrl = null;
      song._blobPromise = null;
      const u = await resolveNetUrl(song, true).catch(() => '');
      if (u) { playNetBlob(song, attempt + 1); return; }
    }
    showMiniToast('这首歌暂时加载不了，已跳过');
    skipBrokenSong();
  });
}

function loadAndPlay() {
  const song = state.songs[state.currentIndex];
  if (!song) return;

  if (song.isNet && !song.downloaded) {
    showMiniToast('正在获取播放地址…');
    // 先解析出真正能播的地址（占位串、过期地址、付费曲目都在这一步处理）
    resolveNetUrl(song).then((u) => {
      if (!state.songs[state.currentIndex] || state.songs[state.currentIndex].id !== song.id) return;
      if (!u) {
        showMiniToast('这首歌全网都找不到能播的音源，已跳过');
        skipBrokenSong();
        return;
      }
      if (song._bridged) showMiniToast('原音源播不了，已自动换源播放');
      if (song._blobUrl) { playAudioUrl(song._blobUrl); return; }
      showMiniToast(song._bridged ? '原音源不可用，已自动换源' : '正在加载音频…');
      playNetBlob(song, 1);
    });
  } else {
    playAudioUrl(song.url);
  }
  state.isPlaying = true;
  startLyricsAnimation();

  // 更新UI
  document.getElementById('fsSongName').textContent = song.name;
  updateDiscCover(song);
  document.getElementById('disc').classList.add('playing');
  document.getElementById('miniAlbum').classList.add('playing');

  updatePlayIcon();
  renderPlaylist();
  updateFavButton();
  updateFsDownloadBtn();
  initVisualizer();
  if (song.isNet) {
    loadNetLyrics(song);   // 网络歌曲：自动匹配在线歌词
  } else {
    generateLyrics(song.name);
  }
  updateMediaSession(song);
  syncNativeAudio();
}

// ===== 唱片封面：网络歌自动抓图塞进唱片，本地歌 / 抓不到回退音符图标 =====
const coverLookupCache = {};

async function findSongCover(song) {
  if (!song) return '';
  if (song.artwork) return song.artwork;
  if (coverLookupCache[song.id] !== undefined) return coverLookupCache[song.id];
  if (!song.isNet) { coverLookupCache[song.id] = ''; return ''; }

  const kw = ((song.name || '') + ' ' + ((song.artist || '').split('/')[0] || '')).trim();
  if (!kw) { coverLookupCache[song.id] = ''; return ''; }

  coverLookupCache[song.id] = '';
  const searchers = [
    () => searchNetease(kw, 3),
    () => searchQQ(kw, 3),
    () => searchKuwo(kw, 3),
    () => searchItunesSource(kw, 3)
  ];

  for (let i = 0; i < searchers.length; i++) {
    let list = [];
    try { list = (await searchers[i]()) || []; } catch (e) { continue; }
    const hit = list.find(x => x && x.artwork && sameSong(song, x))
             || list.find(x => x && x.artwork && nameLooseEq(song.name, x.name));
    if (hit && hit.artwork) {
      const url = String(hit.artwork).replace(/^http:/, 'https:');
      coverLookupCache[song.id] = url;
      song.artwork = url;
      try { dbUpdateMeta(song.id, { artwork: url }).catch(() => {}); } catch (e) {}
      return url;
    }
  }
  return '';
}

function paintCover(imgId, iconId, url) {
  const img = document.getElementById(imgId);
  const icon = document.getElementById(iconId);
  if (!img) return;
  if (url) {
    img.src = url;
    img.style.display = 'block';
    if (icon) icon.style.display = 'none';
  } else {

// ===== 耳机 / 蓝牙耳机线控（Media Session） =====
function updateMediaSession(song) {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.name || '本地音乐',
      artist: song.artist || '本地音乐',
      album: '声谷音乐播放器'
    });
    navigator.mediaSession.playbackState = 'playing';
  } catch (e) {
    console.log('MediaSession 不可用:', e);
  }
}

function setMediaPlaybackState(playing) {
  if (!('mediaSession' in navigator)) return;
  try {
    navigator.mediaSession.playbackState = playing ? 'playing' : 'paused';
  } catch (e) {}
}

function initWebMediaSessionActions() {
  if (!('mediaSession' in navigator) || !navigator.mediaSession.setActionHandler) return;
  try {
    navigator.mediaSession.setActionHandler('seekto', (d) => {
      if (d && d.seekTime != null) audio.currentTime = d.seekTime;
    });
    navigator.mediaSession.setActionHandler('seekbackward', (d) => {
      audio.currentTime = Math.max(0, audio.currentTime - ((d && d.seekOffset) || 10));
    });
    navigator.mediaSession.setActionHandler('seekforward', (d) => {
      audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + ((d && d.seekOffset) || 10));
    });
  } catch (e) {}
}

function initMediaSession() {
  if (!('mediaSession' in navigator)) return;
  const ms = navigator.mediaSession;
  try {
    ms.setActionHandler('play', () => togglePlay());
    ms.setActionHandler('pause', () => togglePlay());
    ms.setActionHandler('previoustrack', () => prevSong());
    ms.setActionHandler('nexttrack', () => nextSong());
    // 兼容部分耳机的快退/快进按键
    ms.setActionHandler('seekbackward', () => { audio.currentTime = Math.max(0, audio.currentTime - 5); });
    ms.setActionHandler('seekforward', () => { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5); });
    ms.setActionHandler('stop', () => {
      audio.pause();
      state.isPlaying = false;
      stopLyricsAnimation();
      updatePlayIcon();
    });
  } catch (e) {
    console.log('注册媒体按键失败:', e);
  }
  // 向系统同步播放进度（部分壳/系统用它画媒体卡片的进度条）
  try {
    audio.addEventListener('timeupdate', () => {
      if (!navigator.mediaSession.setPositionState) return;
      if (!audio.duration || isNaN(audio.duration)) return;
      const st = Math.min(audio.duration, Math.max(0, audio.currentTime || 0));
      navigator.mediaSession.setPositionState({ duration: audio.duration, playbackRate: audio.playbackRate || 1, position: st });
    });
  } catch (e) {}
}

function togglePlay() {
  if (state.currentIndex === -1) {
    // 播放第一首
    const list = getFilteredSongs();
    if (list.length > 0) {
      playSongById(list[0].id);
    }
    return;
  }
  if (audio.paused) {
    audio.play();
    state.isPlaying = true;
    startLyricsAnimation();
  } else {
    audio.pause();
    state.isPlaying = false;
    stopLyricsAnimation();
  }
  updatePlayIcon();
}

function updatePlayIcon() {
  const icon = state.isPlaying
    ? '<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  document.getElementById('playIcon').innerHTML = icon;
  document.getElementById('fsPlayIcon').innerHTML = icon;
  const fsPlayIcon2 = document.getElementById('fsPlayIcon2');
  if (fsPlayIcon2) fsPlayIcon2.innerHTML = icon;
  document.getElementById('disc').classList.toggle('playing', state.isPlaying);
  document.getElementById('miniAlbum').classList.toggle('playing', state.isPlaying);
}

function prevSong() {
  if (state.songs.length === 0) return;
  const list = getFilteredSongs();
  if (list.length === 0) return;

  if (state.playMode === 'shuffle') {
    playRandom(list);
    return;
  }

  const currentId = state.songs[state.currentIndex]?.id;
  const idxInList = list.findIndex(s => s.id == currentId);
  const prevIdx = idxInList <= 0 ? list.length - 1 : idxInList - 1;
  playSongById(list[prevIdx].id);
}

function nextSong() {
  if (state.songs.length === 0) return;
  const list = getFilteredSongs();
  if (list.length === 0) return;

  if (state.playMode === 'shuffle') {
    playRandom(list);
    return;
  }

  const currentId = state.songs[state.currentIndex]?.id;
  const idxInList = list.findIndex(s => s.id == currentId);
  const nextIdx = idxInList >= list.length - 1 ? 0 : idxInList + 1;
  playSongById(list[nextIdx].id);
}

function playRandom(list) {
  if (list.length === 1) {
    playSongById(list[0].id);
    return;
  }
  let rand;
  do {
    rand = Math.floor(Math.random() * list.length);
  } while (list[rand].id == state.songs[state.currentIndex]?.id);
  playSongById(list[rand].id);
}

// 加载元数据后回填时长并持久化
audio.addEventListener('loadedmetadata', () => {
  const song = state.songs[state.currentIndex];
  if (!song || !audio.duration || isNaN(audio.duration)) return;
  // iTunes 是 30 秒试听，保留曲库整曲时长；其余音源是整曲，回填真实时长
  if (!song.isNet || !song.preview) {
    song.duration = audio.duration;
    if (!song.isNet) dbUpdateMeta(song.id, { duration: audio.duration }).catch(() => {});
    if (song.isNet) saveNetMeta();
    renderPlaylist();
  }
});

// 网络歌曲地址过期或取流失败时自动换一个新地址重试，仍失败就跳过这首
let netRetryAt = 0;
audio.addEventListener('playing', () => { brokenSkipStreak = 0; });
audio.addEventListener('error', async () => {
  const song = state.songs[state.currentIndex];
  if (!song || !song.isNet || song.downloaded) return;
  if (Date.now() - netRetryAt < 3000) return;
  netRetryAt = Date.now();
  const oldUrl = song.url;
  try {
    song._blobUrl = null;
    song._blobPromise = null;
    // force：跳过已经播不出来的旧地址，直接全网搜同曲找别的音源
    const u = await resolveNetUrl(song, true);
    if (u && u !== oldUrl) {
      const pos = audio.currentTime || 0;
      const restore = () => { try { if (pos > 3) audio.currentTime = pos; } catch (e) {} };
      audio.addEventListener('loadedmetadata', restore, { once: true });
      showMiniToast(song._bridged ? '原音源播不了，已自动换源播放' : '已重新获取播放地址');
      playNetBlob(song, 2);
      return;
    }
  } catch (e) {
    console.log('网络歌曲重试失败:', e && e.message);
  }
  showMiniToast('这首歌暂时播不了，已跳过');
  skipBrokenSong();
});

}

function startVolumeDrag(event) {
  event.preventDefault();
  event.stopPropagation();
  const track = event.currentTarget;
  const pop = track.closest('.volume-slider-pop');
  
  // 拖动时禁用过渡，避免延迟感
  const fill = track.querySelector('.volume-slider-fill');
  const thumb = track.querySelector('.volume-slider-thumb');
  fill.style.transition = 'none';
  thumb.style.transition = 'none';
  
  function updateFromY(clientY) {
    const rect = track.getBoundingClientRect();
    let percent = (rect.bottom - clientY) / rect.height;
    percent = Math.max(0, Math.min(1, percent));
    audio.volume = percent;
    // 只更新当前滑块组
    pop.querySelectorAll('.volume-slider-fill').forEach(f => f.style.height = percent * 100 + '%');
    pop.querySelectorAll('.volume-slider-thumb').forEach(t => t.style.bottom = `calc(${percent * 100}% - 8px)`);
  }
  
  updateFromY(event.clientY);
  
  function onMove(e) {
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    if (clientY !== undefined) updateFromY(clientY);
  }
  function onUp() {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('touchmove', onMove);
    document.removeEventListener('mouseup', onUp);
    document.removeEventListener('touchend', onUp);
    // 恢复过渡
    fill.style.transition = '';
    thumb.style.transition = '';
  }
  document.addEventListener('mousemove', onMove, { passive: false });
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('mouseup', onUp);
  document.addEventListener('touchend', onUp);
}

function updateVolumeUI(volume) {
  const percent = volume * 100;
  document.querySelectorAll('.volume-slider-fill').forEach(f => f.style.height = percent + '%');
  document.querySelectorAll('.volume-slider-thumb').forEach(t => t.style.bottom = `calc(${percent}% - 8px)`);
}

// ===== 歌词系统 =====
let currentLyrics = []; // 保存当前歌词数据

function generateLyrics(songName) {
  // 生成模拟歌词（根据歌曲时长）
  const duration = audio.duration || 180;
  currentLyrics = [
    { time: 0, text: songName },
    { time: duration * 0.1, text: '—— 音乐响起 ——' },
    { time: duration * 0.2, text: '在旋律中寻找自己' },
    { time: duration * 0.3, text: '每一个音符都是故事' },
    { time: duration * 0.4, text: '时光随节奏流淌' },
    { time: duration * 0.5, text: '心跳与鼓点同频' },
    { time: duration * 0.6, text: '回忆在歌声里苏醒' },
    { time: duration * 0.7, text: '情感随旋律起伏' },
    { time: duration * 0.8, text: '让音乐带你远行' },
    { time: duration * 0.9, text: '—— 渐弱 ——' },
    { time: duration - 2, text: '感谢聆听' }
  ];

  renderLyrics();
}

function renderLyrics() {
  // 播放界面：单层歌词
  const miniHtml = currentLyrics.map((line, i) => {
    const nextTime = i < currentLyrics.length - 1 ? currentLyrics[i + 1].time : line.time + 5;
    return `
      <div class="lyrics-line" data-time="${line.time}" data-duration="${nextTime - line.time}" data-index="${i}" onclick="seekToLyric(${line.time})">
        <div class="lyrics-text">${line.text}</div>
      </div>
    `;
  }).join('');

  // 全屏界面：双层卡拉OK歌词
  const fullHtml = currentLyrics.map((line, i) => {
    const nextTime = i < currentLyrics.length - 1 ? currentLyrics[i + 1].time : line.time + 5;
    return `
      <div class="lyrics-line" data-time="${line.time}" data-duration="${nextTime - line.time}" data-index="${i}" onclick="seekToLyric(${line.time})">
        <div class="lyrics-text-bg">${line.text}</div>
        <div class="lyrics-text-fg" style="width: 0%">${line.text}</div>
      </div>
    `;
  }).join('');

  const miniEl = document.getElementById('lyricsContainer');
  const fullEl = document.getElementById('lyricsFullContainer');
  miniEl.innerHTML = '<div class="lyric-spacer"></div>' + miniHtml + '<div class="lyric-spacer"></div>';
  fullEl.innerHTML = '<div class="lyric-spacer fs-spacer"></div>' + fullHtml + '<div class="lyric-spacer fs-spacer"></div>';
  syncFullLyricSpacers();

  // 换歌后重置滚动记忆
  const fEl = document.getElementById('lyricsFullContainer');
  if (fEl) delete fEl.dataset.lastIdx;

  // 单句模式下默认点亮第一句，避免出现空白
  const firstMini = miniEl.querySelector('.lyrics-line');
  if (firstMini) firstMini.classList.add('active');
  const firstFull = fullEl.querySelector('.lyrics-line');
  if (firstFull) firstFull.classList.add('active');
}

function seekToLyric(time) {
  audio.currentTime = time;
}

let rafId = null;

function updateLyricsHighlight() {
  // 播放界面：整行高亮
  const miniContainer = document.getElementById('lyricsContainer');
  if (miniContainer) {
    const lines = miniContainer.querySelectorAll('.lyrics-line');
    if (lines.length > 0) {
      let activeIdx = 0;
      lines.forEach((line, i) => {
        const time = parseFloat(line.dataset.time);
        if (audio.currentTime >= time) activeIdx = i;
      });
      lines.forEach((line, i) => {
        const isActive = i === activeIdx;
        line.classList.toggle('active', isActive);
        // 三行窗口：只点亮当前句及其上下各一句
        line.classList.toggle('lyric-near', !isActive && Math.abs(i - activeIdx) === 1);
      });
      if (!miniContainer.dataset.userScrolling) {
        const activeLine = lines[activeIdx];
        if (activeLine) {
          const offset = activeLine.offsetTop - miniContainer.clientHeight / 2 + activeLine.clientHeight / 2;
          miniContainer.scrollTop = offset;
        }
      }
    }
  }

  // 全屏界面：卡拉OK逐字高亮
  const fullContainer = document.getElementById('lyricsFullContainer');
  if (fullContainer) {
    const lines = fullContainer.querySelectorAll('.lyrics-line');
    if (lines.length > 0) {
      const scrubbing = fullContainer.dataset.scrubbing === 'true';
      let activeIdx = 0;
      if (scrubbing) {
        // 拖动中：以中线上的那一句为准
        activeIdx = centerLyricIndex(lines, fullContainer);
        const badge = document.getElementById('lyricScrubTime');
        if (badge) {
          const t = parseFloat(lines[activeIdx].dataset.time) || 0;
          badge.textContent = formatTime(t);
          badge.style.opacity = '1';
        }
      } else {
        lines.forEach((line, i) => {
          const time = parseFloat(line.dataset.time);
          if (audio.currentTime >= time) activeIdx = i;
        });
      }
      lines.forEach((line) => line.classList.remove('scrub-focus'));
      if (scrubbing && lines[activeIdx]) lines[activeIdx].classList.add('scrub-focus');
      
      // 只更新变化的行，提升性能
      lines.forEach((line, i) => {
        const isActive = i === activeIdx;
        const wasActive = line.classList.contains('active');
        if (isActive !== wasActive) {
          line.classList.toggle('active', isActive);
          const fg = line.querySelector('.lyrics-text-fg');
          if (fg && !isActive) {
            fg.style.width = '0%';
          }
        }
        
        if (isActive) {
          const fg = line.querySelector('.lyrics-text-fg');
          if (fg) {
            const startTime = parseFloat(line.dataset.time);
            const duration = parseFloat(line.dataset.duration) || 3;
            const progress = Math.min(1, Math.max(0, (audio.currentTime - startTime) / duration));
            const newWidth = (progress * 100) + '%';
            if (fg.style.width !== newWidth) {
              fg.style.width = newWidth;
            }
          }
        }
      });
      
      // 只有句号变化时才滚动一次，平滑动画跟随；拖动中不跟随
      // 时间线始终保持对准歌词区中线（布局变化时自动纠正）
      const tl = document.getElementById('lyricTimeline');
      const fs = document.getElementById('lyricsFullscreen');
      if (tl && fs && fs.classList.contains('active')) {
        const r = fullContainer.getBoundingClientRect();
        const target = Math.round(r.top - fs.getBoundingClientRect().top + r.height / 2);
        if (Math.abs((parseFloat(tl.style.top) || 0) - target) > 2) {
          tl.style.top = target + 'px';
          const badge = document.getElementById('lyricScrubTime');
          if (badge) badge.style.top = target + 'px';
        }
      }

      if (!scrubbing && !fullContainer.dataset.userScrolling && fullContainer.dataset.lastIdx !== String(activeIdx)) {
        fullContainer.dataset.lastIdx = String(activeIdx);
        const activeLine = lines[activeIdx];
        if (activeLine) {
          const offset = activeLine.offsetTop - fullContainer.clientHeight / 2 + activeLine.clientHeight / 2;
          fullContainer.scrollTo({ top: Math.max(0, offset), behavior: 'smooth' });
        }
      }
    }
  }
}

    );

// ===== 全屏歌词：虚拟时间线 + 拖动定位 =====
function centerLyricIndex(lines, container) {
  const cRect = container.getBoundingClientRect();
  const mid = cRect.top + cRect.height / 2;
  let best = 0, bestDist = Infinity;
  for (let i = 0; i < lines.length; i++) {
    const r = lines[i].getBoundingClientRect();
    const dist = Math.abs((r.top + r.bottom) / 2 - mid);
    if (dist < bestDist) { bestDist = dist; best = i; }
  }
  return best;
}

// 全屏歌词上下留白：让第一句能吃进中线以上、最后一句能滚到中线
function syncFullLyricSpacers() {
  const c = document.getElementById('lyricsFullContainer');
  if (!c) return;
  const h = Math.max(0, Math.round(c.clientHeight / 2 - 26));
  c.querySelectorAll('.lyric-spacer.fs-spacer').forEach((sp) => {
    if (sp.style.height !== h + 'px') sp.style.height = h + 'px';
  });
}

function positionLyricTimeline() {
  const fs = document.getElementById('lyricsFullscreen');
  const c = document.getElementById('lyricsFullContainer');
  const tl = document.getElementById('lyricTimeline');
  const badge = document.getElementById('lyricScrubTime');
  if (!fs || !c || !tl || !fs.classList.contains('active')) return;
  const fsRect = fs.getBoundingClientRect();
  const cRect = c.getBoundingClientRect();
  const y = Math.round(cRect.top - fsRect.top + cRect.height / 2);
  tl.style.top = y + 'px';
  if (badge) badge.style.top = y + 'px';
}

function initLyricScrub() {
  const c = document.getElementById('lyricsFullContainer');
  if (!c || c.dataset.scrubInit === '1') return;
  c.dataset.scrubInit = '1';

  const fs = document.getElementById('lyricsFullscreen');
  const begin = () => {
    c.dataset.scrubbing = 'true';
    if (fs) fs.classList.add('scrubbing');
  };
  const finish = () => {
    if (c.dataset.scrubbing !== 'true') return;
    const lines = [...c.querySelectorAll('.lyrics-line')];
    const idx = centerLyricIndex(lines, c);
    const t = lines[idx] ? parseFloat(lines[idx].dataset.time) : NaN;
    c.dataset.scrubbing = 'false';
    if (fs) fs.classList.remove('scrubbing');
    const badge = document.getElementById('lyricScrubTime');
    if (badge) badge.style.opacity = '0';
    c.querySelectorAll('.lyrics-line.scrub-focus').forEach(el => el.classList.remove('scrub-focus'));
    // 拖到哪唱到哪：松手就跳到时间线上的那一句
    // 但目标时间要夹在真实时长之内（歌词可能比音频长，比如 30 秒试听配整曲歌词），
    // 否则会 seek 到曲尾立刻 ended -> 自动下一首，变成"拖到哪切到哪"
    if (isFinite(t)) {
      const target = Math.max(0, t);
      const dur = audio.duration;
      // 目标落在音频时长之外（歌词比音频长，或拖到最末一句）时就不跳了，
      // 让歌接着唱，否则会 seek 到曲尾秒触发 ended -> 直接切歌
      // 末尾 3 秒也算"够不着"：跳过去马上就会播完、自动下一首（还是切歌）
      const outOfRange = isFinite(dur) && dur > 0 && target > dur - 3;
      if (!outOfRange) {
        scrubSeekGuardUntil = Date.now() + 1600;
        audio.currentTime = target;
      }
    }
    c.dataset.userScrolling = '';
    delete c.dataset.lastIdx;
  };

  // 拖动全程时间线常亮：touchmove 里补一次状态，防止滚动时浏览器中途 pointercancel 把线收掉
  const keep = () => {
    if (c.dataset.scrubbing !== 'true') return;
    if (fs && !fs.classList.contains('scrubbing')) fs.classList.add('scrubbing');
  };

  c.addEventListener('pointerdown', begin, { passive: true });
  c.addEventListener('touchstart', begin, { passive: true });
  c.addEventListener('touchmove', keep, { passive: true });
  window.addEventListener('pointermove', keep, { passive: true });
  window.addEventListener('pointerup', finish);
  // pointercancel 只在手指确实不在屏幕上时才结束（滚动引起的取消不结束拖动）
  window.addEventListener('pointercancel', (e) => {
    if (e && e.pointerType === 'touch') return;
    finish();
  });
  c.addEventListener('touchend', finish);
  c.addEventListener('touchcancel', finish);
  window.addEventListener('resize', () => { syncFullLyricSpacers(); positionLyricTimeline(); });
}

function openLyricsFullscreen() {

async function doLyricsSearch() {
  const keyword = document.getElementById('lyricsSearchInput').value.trim();
  const container = document.getElementById('lyricsSearchResults');

  if (!keyword) {
    container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);font-size:13px;">请输入关键词</div>';
    return;
  }

  container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:13px;">搜索中...</div>';

  try {
    const response = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(keyword)}`);
    if (!response.ok) throw new Error('搜索失败');
    const data = await response.json();

    if (!data || data.length === 0) {
      container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:13px;">未找到相关歌词</div>';
      return;
    }

    container.innerHTML = data.slice(0, 10).map((item, i) => `
      <div class="lyrics-search-result">
        <div class="lyrics-search-result-name">${item.name} - ${item.artistName}</div>
        <div class="lyrics-search-result-preview">${(item.plainLyrics || '').slice(0, 60)}...</div>
        <button onclick="applySearchLyrics(${i})" style="margin-top:8px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);padding:4px 12px;border-radius:6px;font-size:12px;cursor:pointer;width:100%;">添加该歌词</button>
      </div>
    `).join('');

    // 保存搜索结果供点击使用
    window._searchResults = data.slice(0, 10);
  } catch (e) {
    container.innerHTML = '<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:13px;">网络请求失败，请检查网络后重试</div>';
  }
}

function applySearchLyrics(index) {
  const item = window._searchResults[index];
  if (!item) return;

  let lines = [];

  if (item.syncedLyrics) {
    // 解析LRC格式歌词
    const lrcLines = item.syncedLyrics.split('\n');
    lrcLines.forEach(line => {
      const match = line.match(/\[(\d+):(\d+)(?:\.(\d+))?\](.*)/);
      if (match) {
        const min = parseInt(match[1]);
        const sec = parseInt(match[2]);
        const text = match[4].trim();
        if (text) {
          lines.push({ time: min * 60 + sec, text: text });
        }
      }
    });
  }

  // 如果没有同步歌词，用纯文本按行分配
  if (lines.length === 0 && item.plainLyrics) {
    const plainLines = item.plainLyrics.split('\n').filter(l => l.trim());
    const duration = audio.duration || 180;
    plainLines.forEach((text, i) => {
      lines.push({ time: (i / plainLines.length) * duration, text: text.trim() });
    });
  }

  if (lines.length > 0) {
    currentLyrics = lines;
    renderLyrics();
    document.getElementById('lyricsSearchPanel').classList.remove('active');
  }
}

function applyManualLyrics() {
  const text = document.getElementById('manualLyricsInput').value.trim();
  if (!text) return;

  const lines = [];
  const linesArr = text.split('\n');

  linesArr.forEach(line => {
    // 匹配LRC格式 [mm:ss.xx]歌词
    const match = line.match(/\[(\d+):(\d+)(?:\.(\d+))?\](.*)/);
    if (match) {
      const min = parseInt(match[1]);
      const sec = parseInt(match[2]);
      const text = match[4].trim();
      if (text) {
        lines.push({ time: min * 60 + sec, text: text });
      }
    } else if (line.trim()) {
      // 没有时间标签的行，按顺序分配时间
      const lastTime = lines.length > 0 ? lines[lines.length - 1].time + 5 : lines.length * 5;
      lines.push({ time: lastTime, text: line.trim() });
    }
  });

  if (lines.length > 0) {
    currentLyrics = lines;
    renderLyrics();
    document.getElementById('lyricsSearchPanel').classList.remove('active');
  }
}

function setEffect(effect, el) {
  document.querySelectorAll('.effect-preset').forEach(p => p.classList.remove('active'));
  el.classList.add('active');

  // 预设音效对应的值（0-100，50为中间值）
  const presets = {
    normal: { bass: 50, mid: 50, treble: 50 },
    classic: { bass: 40, mid: 55, treble: 65 },
    rock: { bass: 75, mid: 50, treble: 70 },
    concert: { bass: 55, mid: 45, treble: 60 },
    vocal: { bass: 30, mid: 80, treble: 60 },
    bass: { bass: 90, mid: 40, treble: 35 },
    '3d': { bass: 55, mid: 65, treble: 65 }
  };

  const values = presets[effect];
  if (values) {
    const sliders = document.querySelectorAll('.slider-row input');
    sliders[0].value = values.bass;
    sliders[1].value = values.mid;
    sliders[2].value = values.treble;
    applyEQ(values.bass, values.mid, values.treble);
  }
}

function updateEffect(type, value) {
  const sliders = document.querySelectorAll('.slider-row input');
  const bass = parseInt(sliders[0].value);
  const mid = parseInt(sliders[1].value);
  const treble = parseInt(sliders[2].value);
  applyEQ(bass, mid, treble);
}

function applyEQ(bass, mid, treble) {
  if (!state.bassFilter) return;

  // 将0-100映射到-12dB到+12dB
  const bassGain = (bass - 50) / 50 * 12;
  const midGain = (mid - 50) / 50 * 12;
  const trebleGain = (treble - 50) / 50 * 12;

  state.bassFilter.gain.setValueAtTime(bassGain, state.audioContext.currentTime);
  state.midFilter.gain.setValueAtTime(midGain, state.audioContext.currentTime);
  state.trebleFilter.gain.setValueAtTime(trebleGain, state.audioContext.currentTime);
}

// ===== 音频可视化与音效EQ =====
function initVisualizer() {
  if (state.analyser) return;
  try {
    state.audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const source = state.audioContext.createMediaElementSource(audio);

    // 创建三段EQ滤波器
    state.bassFilter = state.audioContext.createBiquadFilter();
    state.bassFilter.type = 'lowshelf';
    state.bassFilter.frequency.value = 200;
    state.bassFilter.gain.value = 0;

    state.midFilter = state.audioContext.createBiquadFilter();
    state.midFilter.type = 'peaking';
    state.midFilter.frequency.value = 1000;
    state.midFilter.Q.value = 1;
    state.midFilter.gain.value = 0;

    state.trebleFilter = state.audioContext.createBiquadFilter();
    state.trebleFilter.type = 'highshelf';
    state.trebleFilter.frequency.value = 3000;
    state.trebleFilter.gain.value = 0;

    state.analyser = state.audioContext.createAnalyser();
    state.analyser.fftSize = 64;

    // 连接音频链路：source -> bass -> mid -> treble -> analyser -> destination
    source.connect(state.bassFilter);
    state.bassFilter.connect(state.midFilter);
    state.midFilter.connect(state.trebleFilter);
    state.trebleFilter.connect(state.analyser);
    state.analyser.connect(state.audioContext.destination);

    drawVisualizer();
  } catch (e) {
    console.log('Visualizer not available:', e);
  }
}

function drawVisualizer() {
  const canvas = document.getElementById('visualizer');
  const ctx = canvas.getContext('2d');
  const bufferLength = state.analyser.frequencyBinCount;
  const dataArray = new Uint8Array(bufferLength);
  let peakData = new Array(bufferLength).fill(0);

  function draw() {
    requestAnimationFrame(draw);
    if (!state.isPlaying) return;

    state.analyser.getByteFrequencyData(dataArray);

    const width = canvas.width = canvas.offsetWidth;
    const height = canvas.height = canvas.offsetHeight;

    // 拖影效果：半透明覆盖实现残影
    ctx.fillStyle = 'rgba(10, 10, 20, 0.25)';
    ctx.fillRect(0, 0, width, height);

    const barWidth = width / bufferLength;

    // 对称柱状图：从中间向两边扩散
    for (let i = 0; i < bufferLength; i++) {
      const value = dataArray[i] / 255;
      const barHeight = value * height * 0.9;

      // 峰值跟踪（拖顶效果）
      if (barHeight > peakData[i]) {
        peakData[i] = barHeight;
      } else {
        peakData[i] *= 0.92; // 峰值缓慢下降
      }

      // 左右对称位置
      const mirrorIdx = bufferLength - 1 - i;
      const x = i * barWidth;
      const mirrorX = mirrorIdx * barWidth;

      // 五彩斑斓彩虹渐变
      const hue = (i * 360 / bufferLength) % 360;
      const gradient = ctx.createLinearGradient(0, height, 0, height - barHeight);
      gradient.addColorStop(0, `hsla(${hue}, 90%, 45%, 0.9)`);
      gradient.addColorStop(0.5, `hsla(${(hue + 40) % 360}, 90%, 55%, 0.85)`);
      gradient.addColorStop(1, `hsla(${(hue + 80) % 360}, 100%, 70%, 0.95)`);

      ctx.fillStyle = gradient;

      // 圆角柱子
      const radius = Math.min(barWidth / 2 - 1, 3);
      const y = height - barHeight;
      const w = barWidth - 2;

      // 绘制圆角矩形
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + w - radius, y);
      ctx.arc(x + w - radius, y + radius, radius, -Math.PI / 2, 0);
      ctx.lineTo(x + w, height);
      ctx.lineTo(x, height);
      ctx.lineTo(x, y + radius);
      ctx.arc(x + radius, y + radius, radius, Math.PI, -Math.PI / 2);
      ctx.closePath();
      ctx.fill();

      // 峰值拖顶小方块
      if (peakData[i] > 2) {
        ctx.fillStyle = `hsla(${(hue + 60) % 360}, 100%, 85%, 0.9)`;
        ctx.fillRect(x, height - peakData[i] - 2, w, 2);
      }
    }
  }
  draw();
}

// ===== 键盘快捷键 =====
// 网页壳（PakePlus / Tauri 等）没有原生 MediaSession 桥时，系统媒体按键常常
// 直接以 keydown 派发给网页，这里兜住，保证耳机/蓝牙按键仍能控制播放。
function handleMediaKey(e) {
  switch (e.code || e.key) {
    case 'MediaPlayPause':
    case 'MediaPlay':
    case 'MediaPause':
      e.preventDefault(); togglePlay(); return true;
    case 'MediaTrackNext':
      e.preventDefault(); nextSong(); return true;
    case 'MediaTrackPrevious':
      e.preventDefault(); prevSong(); return true;
    case 'MediaStop':
      e.preventDefault();
      if (!audio.paused) { audio.pause(); state.isPlaying = false; stopLyricsAnimation(); updatePlayIcon(); }
      return true;
    default:
      return false;
  }
}
document.addEventListener('keydown', (e) => {
  if (handleMediaKey(e)) return;
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') {
    e.preventDefault();
    togglePlay();
  } else if (e.code === 'ArrowRight') {
    audio.currentTime += 5;
  } else if (e.code === 'ArrowLeft') {
    audio.currentTime -= 5;
  } else if (e.code === 'Escape') {
    closeFullscreen();
  }
});

async function restoreSongs() {
  const netBlobs = {};
  try {
    await openDB();
    const records = await dbGetAll();
    records.forEach(rec => {
      // 网络歌曲的已下载文件，单独收集，稍后与推荐元信息合并
      if (rec.isNet) {
        netBlobs[rec.id] = rec;
        return;
      }
      // App 内扫描得到的本机歌曲：只存路径，不存文件本体
      if (rec.nativePath) {
        state.songs.push({
          id: rec.id,
          name: rec.name,
          artist: rec.artist || '',
          url: toPlayableUrl(rec.nativePath),
          nativePath: rec.nativePath,
          duration: rec.duration || 0,
          addedAt: rec.addedAt || Date.now(),
          isFav: !!rec.isFav
        });
        return;
      }
      // 网页端导入的歌曲：文件本体存在数据库里
      if (!rec.blob) return;
      const url = URL.createObjectURL(rec.blob);
      state.songs.push({
        id: rec.id,
        name: rec.name,
        artist: rec.artist || '',
        url: url,
        duration: rec.duration || 0,
        addedAt: rec.addedAt || Date.now(),
        isFav: !!rec.isFav
      });
    });
  } catch (e) {
    console.log('恢复本地歌曲失败:', e);
  }

  restoreNetSongs(netBlobs);
  renderPlaylist();
}

// 恢复网络推荐歌单：元信息来自 localStorage，已下载的音频来自 IndexedDB
function restoreNetSongs(blobMap) {
  loadNetMeta().forEach(item => {
    const rec = blobMap[item.id];
    let url = item.previewUrl || '';
    let downloaded = false;
    if (rec && rec.blob) {
      url = URL.createObjectURL(rec.blob);
      downloaded = true;
    }
    if (!url) return;
    state.songs.push({
      id: item.id,
      name: item.name,
      artist: item.artist || '',
      url: url,
      source: item.source || 'itunes',
      rkey: item.rkey || '',
      preview: !!item.preview,
      chart: item.chart || '',
      searchHit: !!item.searchHit,
      previewUrl: item.previewUrl || '',
      artwork: item.artwork || '',
      duration: item.duration || 0,
      addedAt: item.addedAt || Date.now(),
      isFav: !!item.isFav,
      isNet: true,
      downloaded: downloaded
    });
  });
}
// 安卓/WebView 对 accept 混合写法（MIME + 扩展名）解析不稳定，
// 会变成一个多类型意图，导致系统提示“没有应用可执行此操作”。
// 这里统一收敛为单一 audio/*，具体格式在 getMusicFiles() 里再按扩展名过滤。
(function normalizeAccept() {
  const exts = '.mp3,.flac,.wav,.aac,.ogg,.m4a,.wma,.ape,.opus';
  ['fileInput', 'folderInput'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.setAttribute('accept', 'audio/*');
  });
  window.__MUSIC_EXTS = exts; // 供后续提示文案使用
})();
initMediaSession();

// 封面图加载失败（防盗链 / 失效）时回退成音符图标，不显示破图
(function bindCoverFallback() {
  const fsImg = document.getElementById('discFullCover');
  if (fsImg) {
    fsImg.addEventListener('error', function () {
      fsImg.style.display = 'none';
      const disc = document.getElementById('disc');
      if (disc) disc.classList.remove('cover-mode');
    });
  }
  const miniImg = document.getElementById('miniAlbumImg');
  const miniIcon = document.getElementById('miniAlbumIcon');
  if (miniImg) {
    miniImg.addEventListener('error', function () {
      miniImg.style.display = 'none';
      if (miniIcon) miniIcon.style.display = '';
    });
  }
})();
// 清掉历史里重复的网络歌（老版本没有跨源去重，同一个歌可能存了两条）
function dedupeNetSongs() {
  const curId = state.currentSong && state.currentSong.id;
  const seenKeys = new Set();
  const kept = [];
  state.songs.forEach((s) => {
    if (!s.isNet) { kept.push(s); return; }
    const k = (s.chart || '') + '#' + netKey(s.name, s.artist);
    if (seenKeys.has(k)) return;
    seenKeys.add(k);
    kept.push(s);
  });
  if (kept.length === state.songs.length) return;
  state.songs = kept;
  if (curId) {
    const idx = kept.findIndex(x => x.id === curId);
    state.currentIndex = idx;
  }
  saveNetMeta();
}

restoreSongs().then(() => {
  dedupeNetSongs();
  // 默认落在网络推荐页，没有歌单就自动联网生成
  if (state.currentView === 'net' && !state.netChart &&
      !state.songs.some(s => s.isNet && !s.chart && !s.searchHit) && !netRecLoading) {
    fetchNetRecommend();
  }
});
</script>
