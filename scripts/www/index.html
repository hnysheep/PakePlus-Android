<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>声谷 · 本地音乐播放器</title>
<link rel="manifest" href="./manifest.json">
<style>
/* ===== 基础重置与变量 ===== */
:root {
  --bg-deep: #0c0c12;
  --bg-card: #16161f;
  --bg-elevated: #1e1e2a;
  --accent: #e8c547;
  --accent-soft: rgba(232, 197, 71, 0.15);
  --text-primary: #f0f0f5;
  --text-secondary: #8a8a9a;
  --text-muted: #5a5a6a;
  --border: rgba(255, 255, 255, 0.06);
  --danger: #e85a4f;
  --radius: 12px;
  --transition: cubic-bezier(0.22, 1, 0.36, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg-deep);
  color: var(--text-primary);
  min-height: 100vh;
  overflow: hidden;
}

/* ===== 应用主布局 ===== */
#app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  height: 100vh;
}

/* ===== 顶部栏 ===== */
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 28px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-deep);
  z-index: 10;
}

.search-box {
  display: flex;
  align-items: center;
  gap: 8px;
  height: 38px;
  padding: 0 6px 0 12px;
  border-radius: 20px;
  border: 1px solid var(--border);
  background: var(--bg-card);
}

.search-box:focus-within { border-color: var(--accent); }

.search-icon {
  flex: 0 0 16px;
  width: 16px;
  height: 16px;
  color: var(--text-muted);
}

.search-box input {
  flex: 1 1 auto;
  min-width: 0;
  height: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-size: 13px;
}

.search-box input::placeholder { color: var(--text-muted); }

.search-clear {
  flex: 0 0 22px;
  width: 22px;
  height: 22px;
  border: none;
  border-radius: 50%;
  background: var(--bg-elevated);
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1;
  cursor: pointer;
}

.search-btn {
  flex: 0 0 auto;
  height: 30px;
  padding: 0 16px;
  border: none;
  border-radius: 15px;
  background: var(--accent);
  color: #111;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
}

/* 网络推荐上方的四个榜 */
.chart-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  padding: 12px 14px 4px;
}

.chart-card {
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: center;
  gap: 12px;
  height: 62px;
  padding: 0 12px;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
  color: var(--text-primary);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  text-align: left;
  transition: all .15s;
}

.chart-card-text {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
  flex: 0 1 auto;
}

.chart-card-text > span {
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.chart-card-icon {
  flex: 0 0 auto;
  width: 38px;
  height: 38px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(232, 197, 71, .10);
  color: var(--accent);
  transition: all .15s;
}

.chart-card-icon svg {
  width: 21px;
  height: 21px;
  display: block;
}

.chart-card.active .chart-card-icon {
  background: rgba(232, 197, 71, .22);
}

.chart-card small {
  font-size: 10px;
  font-weight: 400;
  color: var(--text-muted);
}

.chart-card:hover { border-color: var(--accent); }
.chart-card.active {
  border-color: var(--accent);
  background: var(--accent-soft);
}

.chart-card.active small { color: var(--accent); }

.search-hit-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 8px 14px;
  font-size: 12px;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border);
}

.search-hit-bar b { color: var(--text-primary); font-weight: 600; }

/* 榜单返回栏 */
.chart-back-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 6px 14px 8px;
  font-size: 12px;
  color: var(--text-muted);
}

.chart-back-bar button {
  border: none;
  background: none;
  color: var(--accent);
  font-size: 12px;
  cursor: pointer;
  padding: 4px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: 0.5px;
}

.logo-icon {
  width: 36px;
  height: 36px;
  background: var(--accent);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 12px rgba(232, 197, 71, 0.2);
}

.logo-icon svg { width: 20px; height: 20px; fill: var(--bg-deep); }

.top-actions {
  display: flex;
  gap: 12px;
  align-items: center;
}

.btn-import {
  background: var(--accent);
  color: var(--bg-deep);
  border: none;
  padding: 10px 22px;
  border-radius: 10px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s var(--transition);
  box-shadow: 0 2px 8px rgba(232, 197, 71, 0.2);
}

.btn-import:hover {
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(232, 197, 71, 0.3);
}

/* ===== 主内容区 ===== */
.main-content {
  display: grid;
  grid-template-columns: 1fr;
  overflow: hidden;
}

/* ===== 侧边栏 ===== */
.sidebar {
  border-right: 1px solid var(--border);
  padding: 24px 14px;
  overflow-y: auto;
}

.sidebar-label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 0 14px 10px;
  font-weight: 600;
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-radius: 10px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 14px;
  margin-bottom: 6px;
  transition: all 0.2s;
  font-weight: 500;
}

.sidebar-item:hover {
  background: var(--bg-elevated);
  color: var(--text-primary);
}

.sidebar-item.active {
  background: var(--accent-soft);
  color: var(--accent);
}

.sidebar-item svg { width: 18px; height: 18px; }

/* ===== 歌曲列表区 ===== */
.playlist-area {
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.playlist-header {
  display: flex;
  flex-direction: column;
  align-items: stretch;
  gap: 6px;
  padding: 8px 28px 10px;
  border-bottom: 1px solid var(--border);
}

.playlist-header-left {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 24px;
}

.playlist-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.3px;
  cursor: pointer;
}

.view-tabs {
  display: flex;
  align-self: flex-start;
  gap: 8px;
  background: var(--bg-elevated);
  padding: 4px;
  border-radius: 8px;
}
  justify-content: center;
}

.sort-controls {
  display: flex;
  align-self: flex-start;
  gap: 6px;
  justify-content: flex-start;
  align-items: center;
  margin: 0;
}

.sort-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 4px 10px;
  border-radius: 5px;
  font-size: 11px;
  cursor: pointer;
  transition: all 0.2s;
  font-weight: 500;
}

.sort-btn:hover {
  color: var(--text-secondary);
}

.sort-btn.active {
  background: var(--accent-soft);
  color: var(--accent);
}

.view-tab {
  background: transparent;
  border: none;
  color: var(--text-muted);
  padding: 0;
  font-size: 22px;
  cursor: pointer;
  transition: all 0.2s;
  font-weight: 400;
}

.view-tab:hover {
  color: var(--text-secondary);
}

.view-tab.active {
  color: var(--text-primary);
  font-weight: 700;
}

.song-list {
  flex: 1;
  overflow-y: auto;
  padding: 12px 0;
}

.song-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 0 12px;
  height: 46px;
  cursor: pointer;
  transition: background 0.15s;
  position: relative;
  box-sizing: border-box;
}

.song-item:hover { background: var(--bg-card); }
.song-item.playing { background: var(--accent-soft); }

.song-index {
  flex: 0 0 18px;
  width: 18px;
  color: var(--text-muted);
  font-size: 12px;
  text-align: center;
  font-variant-numeric: tabular-nums;
}

.song-item.playing .song-index { color: var(--accent); }

.song-cover {
  flex: 0 0 24px;
  width: 24px;
  height: 24px;
  border-radius: 4px;
  object-fit: cover;
  background: var(--bg-elevated);
}

.song-cover.ph { opacity: .45; }

.song-name {
  flex: 1 1 auto;
  min-width: 0;
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-primary);
  line-height: 1.2;
}

.song-meta {
  flex: 0 1 auto;
  max-width: 32%;
  font-size: 11px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.src-tag {
  flex: 0 0 auto;
  font-size: 10px;
  line-height: 1.5;
  padding: 0 4px;
  border-radius: 3px;
  border: 1px solid rgba(255,255,255,.16);
  color: var(--text-muted);
  white-space: nowrap;
}

.src-tag.src-qq { color: #7ecbff; border-color: rgba(126,203,255,.4); }
.src-tag.src-kugou { color: #ffb38a; border-color: rgba(255,179,138,.4); }
.src-tag.src-netease { color: #ff8a9b; border-color: rgba(255,138,155,.4); }
.src-tag.src-douyin { color: #9ef0d8; border-color: rgba(158,240,216,.4); }
.src-tag.src-itunes { color: #c9b6ff; border-color: rgba(201,182,255,.4); }

@keyframes marquee {
  0% { transform: translateX(0); }
  40% { transform: translateX(calc(-100% + 200px)); }
  60% { transform: translateX(calc(-100% + 200px)); }
  100% { transform: translateX(0); }
}

.song-item.playing .song-name {
  color: var(--accent);
  font-weight: 600;
}

.song-duration {
  flex: 0 0 34px;
  font-size: 12px;
  color: var(--text-muted);
  text-align: right;
  font-variant-numeric: tabular-nums;
}

@media (max-width: 480px) {
  .song-item { gap: 5px; padding: 0 8px; }
  .song-cover { flex-basis: 22px; width: 22px; height: 22px; }
  .song-duration { display: none; }   /* 手机端把宽度让给歌名 */
  .song-meta { max-width: 24%; font-size: 10px; }
  .src-tag { font-size: 9px; padding: 0 3px; }
}

.fav-btn {
  flex: 0 0 22px;
  width: 22px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.fav-btn svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: var(--text-muted);
  stroke-width: 2;
  transition: all 0.2s;
}

.fav-btn.faved svg {
  fill: var(--danger);
  stroke: var(--danger);
}

.more-btn {
  flex: 0 0 20px;
  width: 20px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 1px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  border-radius: 50%;
  transition: all 0.2s;
}

.more-btn:hover {
  color: var(--text-primary);
  background: var(--bg-elevated);
}

.more-btn svg {
  width: 16px;
  height: 16px;
  fill: currentColor;
}

.song-menu {
  position: absolute;
  right: 10px;
  top: 42px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 6px 0;
  z-index: 50;
  min-width: 120px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  opacity: 0;
  visibility: hidden;
  transform: translateY(-4px);
  transition: all 0.2s;
}

.song-menu.active {
  opacity: 1;
  visibility: visible;
  transform: translateY(0);
}

.song-menu-item {
  padding: 10px 16px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s;
  color: var(--text-secondary);
}

.song-menu-item:hover {
  background: var(--bg-card);
  color: var(--danger);
}

/* ===== 迷你播放器（底部） ===== */
.mini-player {
  display: flex;
  flex-direction: column;
  padding: 10px 20px 12px;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  gap: 8px;
  box-shadow: 0 -4px 20px rgba(0,0,0,0.2);
}

.mini-main-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}

.mini-controls-row {
  display: flex;
  align-items: center;
  justify-content: space-around;
  gap: 0;
  flex: 1;
  padding: 0 12px;
}

.mini-controls-row > * {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.mini-progress-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.mini-album {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  background: var(--bg-elevated);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  overflow: visible;
  cursor: pointer;
  transition: transform 0.2s var(--transition);
  box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  position: relative;
}

.mini-album::before {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(232, 197, 71, 0.5) 0%, rgba(232, 197, 71, 0.15) 40%, transparent 70%);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.mini-album::after {
  content: '';
  position: absolute;
  inset: -10px;
  border-radius: 50%;
  border: 1px solid rgba(232, 197, 71, 0.3);
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

.mini-album:hover { transform: scale(1.05); }
.mini-album.playing {
  animation: spin 8s linear infinite;
}

.mini-album.playing::before {
  opacity: 1;
  animation: glowPulse 2s ease-in-out infinite;
}

.mini-album.playing::after {
  opacity: 1;
  animation: ringPulse 2s ease-out infinite;
}

/* 散光闪烁点 */
.sparkle {
  position: absolute;
  width: 4px;
  height: 4px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 6px var(--accent);
  opacity: 0;
  pointer-events: none;
}

.mini-album.playing .sparkle {
  animation: sparkleBlink 1.5s ease-in-out infinite;
}

.mini-album.playing .sparkle:nth-child(1) { top: -8px; left: 50%; animation-delay: 0s; }
.mini-album.playing .sparkle:nth-child(2) { top: 50%; right: -8px; animation-delay: 0.3s; }
.mini-album.playing .sparkle:nth-child(3) { bottom: -8px; left: 50%; animation-delay: 0.6s; }
.mini-album.playing .sparkle:nth-child(4) { top: 50%; left: -8px; animation-delay: 0.9s; }

@keyframes sparkleBlink {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  50% { opacity: 1; transform: scale(1.2); }
}

@keyframes glowPulse {
  0%, 100% { opacity: 0.6; transform: scale(1); }
  50% { opacity: 1; transform: scale(1.15); }
}

@keyframes ringPulse {
  0% { opacity: 0.6; transform: scale(1); }
  100% { opacity: 0; transform: scale(1.4); }
}

.mini-album svg {
  width: 28px;
  height: 28px;
  fill: var(--text-muted);
  position: relative;
  z-index: 2;
}

.mini-text {
  min-width: 0;
  overflow: hidden;
}

.mini-name {
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-primary);
  display: inline-block;
  animation: miniMarquee 6s linear infinite;
  animation-play-state: paused;
}

.mini-player:hover .mini-name {
  animation-play-state: running;
}

/* 迷你播放器歌词 */
.mini-text { min-width: 0; }

.mini-name {
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text-primary);
  display: inline-block;
}

.mini-center {
  display: flex;
  align-items: center;
  justify-content: space-evenly;
  gap: 12px;
}

.mini-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.control-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  border-radius: 50%;
  transition: all 0.2s;
}

.control-btn:hover {
  color: var(--text-primary);
  background: var(--bg-elevated);
}

.control-btn svg { width: 22px; height: 22px; fill: currentColor; }

.play-pause-btn {
  width: 44px;
  height: 44px;
  min-width: 44px;
  border-radius: 50%;
  background: var(--accent);
  color: var(--bg-deep);
  box-shadow: 0 3px 15px rgba(232, 197, 71, 0.4);
  flex-shrink: 0;
  margin: 0 6px;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
}

.play-pause-btn:hover {
  transform: scale(1.08);
  box-shadow: 0 6px 24px rgba(232, 197, 71, 0.6);
}

.play-mode-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  padding: 8px;
  border-radius: 50%;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.play-mode-btn:hover {
  color: var(--text-primary);
  background: var(--bg-elevated);
}

.play-mode-btn svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

.mini-fav-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  padding: 8px;
  border-radius: 50%;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.mini-fav-btn:hover {
  color: #ff4757;
  background: var(--bg-elevated);
}

.mini-fav-btn svg {
  width: 20px;
  height: 20px;
  fill: currentColor;
}

.mini-fav-btn.favorited {
  color: #ff4757;
}

/* 音量按钮和滑块 */
.volume-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 8px;
  border-radius: 50%;
  transition: all 0.2s;
  position: relative;
}

.volume-btn:hover {
  color: var(--text-primary);
  background: var(--bg-elevated);
}

.volume-btn svg {
  width: 20px;
  height: 20px;
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
}

.volume-slider-pop {
  position: absolute;
  bottom: 50px;
  left: 50%;
  transform: translateX(-50%);
  width: 36px;
  height: 120px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 18px;
  display: none;
  flex-direction: column;
  align-items: center;
  padding: 12px 0;
  z-index: 100;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
}

.volume-slider-pop.active {
  display: flex;
}

.volume-slider-track {
  width: 4px;
  height: 90px;
  background: var(--bg-card);
  border-radius: 2px;
  position: relative;
  cursor: pointer;
}

.volume-slider-fill {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  background: var(--accent);
  border-radius: 2px;
  height: 70%;
  transition: height 0.15s ease-out;
}

.volume-slider-thumb {
  position: absolute;
  bottom: calc(70% - 8px);
  left: 50%;
  transform: translateX(-50%);
  width: 16px;
  height: 16px;
  background: var(--accent);
  border-radius: 50%;
  cursor: grab;
  box-shadow: 0 2px 8px rgba(232, 197, 71, 0.4);
  transition: bottom 0.15s ease-out;
}

.volume-slider-thumb:active {
  cursor: grabbing;
}

.mini-progress-area {
  display: flex;
  align-items: center;
  gap: 10px;
  justify-content: flex-end;
}

.time-display {
  font-size: 11px;
  color: var(--text-muted);
  font-variant-numeric: tabular-nums;
  min-width: 35px;
}

.progress-bar {
  flex: 1;
  max-width: 200px;
  height: 4px;
  background: var(--bg-elevated);
  border-radius: 2px;
  cursor: pointer;
  position: relative;
  transition: height 0.2s;
}

.progress-bar:hover {
  height: 6px;
}

.progress-fill {
  height: 100%;
  background: var(--accent);
  border-radius: 2px;
  width: 0%;
  position: relative;
  box-shadow: 0 0 8px rgba(232, 197, 71, 0.6);
  overflow: hidden;
}

.progress-fill::before {
  content: '';
  position: absolute;
  top: 0;
  left: -50%;
  width: 50%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
  animation: progressShine 2s linear infinite;
}

.progress-fill::after {
  content: '';
  position: absolute;
  top: 50%;
  right: -10px;
  transform: translateY(-50%);
  width: 20px;
  height: 20px;
  background: radial-gradient(circle, #ffffff 0%, #fff8dc 35%, rgba(255, 215, 0, 0.4) 65%, transparent 100%);
  border-radius: 50%;
  filter: blur(0.5px);
  box-shadow: 
    0 0 15px 5px rgba(255, 255, 255, 1),
    0 0 30px 10px rgba(255, 215, 0, 0.9),
    0 0 50px 20px rgba(255, 215, 0, 0.5);
  animation: pulseGlow 0.8s ease-in-out infinite;
}

@keyframes progressShine {
  0% { left: -50%; }
  100% { left: 100%; }
}

@keyframes pulseGlow {
  0%, 100% { 
    box-shadow: 
      0 0 8px 2px rgba(255, 255, 255, 0.8),
      0 0 16px 5px rgba(255, 215, 0, 0.5),
      0 0 28px 10px rgba(255, 215, 0, 0.2);
    opacity: 0.85;
    transform: translateY(-50%) scale(1);
  }
  50% { 
    box-shadow: 
      0 0 25px 10px rgba(255, 255, 255, 1),
      0 0 50px 20px rgba(255, 215, 0, 1),
      0 0 80px 40px rgba(255, 215, 0, 0.7);
    opacity: 1;
    transform: translateY(-50%) scale(2);
  }
}

@keyframes noteFloat {
  0% {
    opacity: 0.8;
    transform: translateX(0) translateY(0) scale(0.4) rotate(0deg);
  }
  40% {
    opacity: 0.7;
    transform: translateX(-6px) translateY(-15px) scale(0.8) rotate(10deg);
  }
  100% {
    opacity: 0;
    transform: translateX(-15px) translateY(-25px) scale(0.6) rotate(-5deg);
  }
}

.expand-btn {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
}

.expand-btn:hover { color: var(--text-primary); }
.expand-btn svg { width: 18px; height: 18px; }

/* ===== 全屏播放界面 ===== */
.fullscreen-player {
  position: fixed;
  inset: 0;
  background: var(--bg-deep);
  z-index: 100;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 40px;
  overflow: hidden;
}

.fullscreen-player.active {
  display: flex;
  animation: fadeIn 0.4s var(--transition);
}

@keyframes fadeIn {
  from { opacity: 0; transform: scale(1.02); }
  to { opacity: 1; transform: scale(1); }
}

/* 背景光晕 */
.bg-glow {
  position: absolute;
  width: 600px;
  height: 600px;
  border-radius: 50%;
  background: radial-gradient(circle, var(--accent-soft) 0%, transparent 70%);
  filter: blur(60px);
  opacity: 0.5;
  pointer-events: none;
}

.fs-close {
  position: absolute;
  top: 18px;
  right: 20px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 10;
  transition: all 0.2s;
}

.fs-close:hover { color: var(--text-primary); background: var(--bg-card); }
.fs-close svg { width: 20px; height: 20px; }

/* 旋转唱片 - 缩小版 */
.disc-container {
  position: relative;
  width: 160px;
  height: 160px;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.disc {
  width: 130px;
  height: 130px;
  border-radius: 50%;
  background: conic-gradient(from 0deg, #1a1a2e, #16213e, #0f3460, #1a1a2e);
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  animation: spin 20s linear infinite;
  animation-play-state: paused;
  box-shadow: 0 10px 28px rgba(0,0,0,0.5), 0 0 0 4px rgba(255,255,255,0.04);
  overflow: hidden;
}

.disc.playing { animation-play-state: running; }

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

.disc-cover {
  width: 62%;
  height: 62%;
  border-radius: 50%;
  background: linear-gradient(135deg, #2a2a3e, #1e1e2a);
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  z-index: 2;
  box-shadow: inset 0 0 0 2px rgba(255, 100, 50, 0.15);
}

.disc-cover svg { width: 40%; height: 40%; fill: #ff6b35; opacity: 0.7; }

/* 全屏唱片：有封面时用封面整盘替身，圆形，跟唱片一样大（略大 8px），随唱片一起转 */
.disc-full-cover {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: none;
  z-index: 2;
  pointer-events: none;
}

.disc.cover-mode {
  width: 138px;
  height: 138px;
  background: #14141f;
}

.disc.cover-mode .disc-cover,
.disc.cover-mode .disc-center { display: none; }

/* 封面已经替代唱片本体，黑胶纹路不再压在封面上面 */
.disc.cover-mode::before { display: none; }

.disc.cover-mode .disc-full-cover { display: block; }

/* 点一下封面唱片：切成静止方形封面（在频谱上方、搜歌词按钮下方），再点回圆形转动 */
.disc.cover-mode { cursor: pointer; }

.disc {
  transition: border-radius 0.28s ease, width 0.28s ease, height 0.28s ease;
}

.disc-container.square-mode .disc {
  width: 152px;
  height: 152px;
  border-radius: 12px;
  background: #14141f;
  animation: none;
  box-shadow: 0 10px 26px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
  cursor: pointer;
}

.disc-container.square-mode .disc-full-cover {
  border-radius: 10px;
}

.mini-album-img {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  border-radius: 50%;
  object-fit: cover;
  display: none;
  z-index: 2;
  pointer-events: none;
}

/* 通用确认对话框（取消 / 导入） */
.app-confirm-mask {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.55);
  backdrop-filter: blur(2px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 260;
  padding: 24px;
}
.app-confirm-mask.active { display: flex; }
.app-confirm-box {
  width: 100%;
  max-width: 320px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 22px 20px 14px;
  box-shadow: 0 18px 48px rgba(0, 0, 0, 0.45);
  animation: confirmIn 0.18s ease-out;
}
@keyframes confirmIn {
  from { opacity: 0; transform: scale(0.94); }
  to { opacity: 1; transform: scale(1); }
}
.app-confirm-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}
.app-confirm-msg {
  font-size: 13.5px;
  line-height: 1.75;
  color: var(--text-muted);
  white-space: pre-line;
}
.app-confirm-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
}
.app-confirm-btn {
  flex: 1;
  padding: 11px 0;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-primary);
  font-size: 14px;
  cursor: pointer;
  font-family: inherit;
}
.app-confirm-btn.ok {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  font-weight: 600;
}
.app-confirm-btn:active { transform: scale(0.97); }

.disc-center {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #ff6b35;
  position: absolute;
  z-index: 3;
  box-shadow: 0 0 12px rgba(255, 107, 53, 0.6);
}

/* 唱片纹路 */
.disc::before {
  content: '';
  position: absolute;
  inset: 0;
  border-radius: 50%;
  background: repeating-radial-gradient(
    circle at center,
    transparent 0px,
    transparent 3px,
    rgba(255,255,255,0.03) 3px,
    rgba(255,255,255,0.03) 4px
  );
  z-index: 1;
}

/* 频谱可视化 - 唱片下方 */
.visualizer {
  width: 280px;
  height: 40px;
  margin: 0 auto 16px;
  pointer-events: none;
}

/* 歌词区 */
.lyrics-container {
  width: 100%;
  max-width: 500px;
  height: 120px;
  overflow: hidden;
  position: relative;
  margin-bottom: 16px;
  text-align: center;
  cursor: pointer;
  mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
  -webkit-mask-image: linear-gradient(to bottom, transparent, black 30%, black 70%, transparent);
}

.lyrics-line {
  font-size: 13px;
  color: var(--text-muted);
  padding: 4px 0;
  transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  line-height: 1.5;
  cursor: pointer;
  transform: scale(0.95);
  opacity: 0.7;
  position: relative;
  display: inline-block;
}

.lyrics-line:hover {
  opacity: 0.9;
}

.lyrics-line.active {
  font-size: 16px;
  font-weight: 700;
  color: #ffeb3b;
  transform: scale(1.05);
  opacity: 1;
}

.lyrics-text-bg {
  color: var(--text-muted);
  white-space: nowrap;
}

.lyrics-text {
  color: var(--text-muted);
  white-space: nowrap;
}

.lyrics-line.active .lyrics-text {
  color: #ffeb3b;
}

.lyrics-text-fg {
  position: absolute;
  top: 4px;
  left: 0;
  color: var(--accent);
  overflow: hidden;
  white-space: nowrap;
  text-shadow: 0 0 16px rgba(232, 197, 71, 0.3);
}

/* 歌词：播放界面只显示三行（当前句居中），全屏显示全部，长句自动换行 */
.lyrics-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  height: 132px;
  mask-image: linear-gradient(to bottom, transparent 0, black 8%, black 92%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, transparent 0, black 8%, black 92%, transparent 100%);
}

/* 播放界面：上下留白，保证第一句与最后一句也能滚到中间 */
.lyric-spacer {
  flex: 0 0 auto;
  height: 48px;
  width: 100%;
}

.lyrics-container .lyrics-line {
  display: block;
  width: 100%;
  max-width: 100%;
  white-space: normal;
  word-break: break-word;
  overflow-wrap: anywhere;
  text-align: center;
  transform: none;
  opacity: 0;
  pointer-events: none;
}

/* 当前句的上一句 / 下一句 */
.lyrics-container .lyrics-line.lyric-near {
  opacity: 0.62;
  pointer-events: auto;
}

.lyrics-container .lyrics-line.active {
  opacity: 1;
  pointer-events: auto;
  transform: none;
  box-sizing: border-box;
}

.lyrics-text,
.lyrics-text-bg,
.lyrics-text-fg {
  white-space: normal;
  word-break: break-word;
  overflow-wrap: anywhere;
}

/* 关闭逐字覆盖层：整句高亮，保持现有观感 */
.lyrics-text-fg,
.lyrics-fullscreen .lyrics-text-fg {
  display: none !important;
}

.lyrics-line.active .lyrics-text-bg {
  color: #ffeb3b;
}

/* 歌曲信息 */
.fs-song-info {
  text-align: center;
  margin-bottom: 12px;
}

.fs-song-name {
  font-size: 18px;
  font-weight: 600;
}

/* 进度条 - 播放按钮上方 */
.fs-progress-area {
  width: 100%;
  max-width: 400px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
}

/* 主控制按钮组 */
.fs-controls {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  align-items: center;
  justify-items: center;
  width: 100%;
  max-width: 380px;
  padding: 0 4px;
  box-sizing: border-box;
  margin-bottom: 0;
}

/* 播放模式图标按钮：与上一曲/播放/下一曲等分并列 */
.fs-mode-btn {
  color: var(--text-muted);
}

.fs-mode-btn:hover { color: var(--text-primary); }
.fs-mode-btn svg { width: 24px; height: 24px; }

.fs-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  border-radius: 50%;
  transition: all 0.2s;
}

.fs-btn:hover { color: var(--text-primary); }
.fs-btn svg { width: 26px; height: 26px; fill: currentColor; }

.fs-play-btn {
  width: 64px;
  height: 64px;
  background: var(--accent);
  color: var(--bg-deep);
}

.fs-play-btn:hover {
  transform: scale(1.05);
  color: var(--bg-deep);
}

/* 辅助按钮行 */
.fs-aux-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  flex-wrap: nowrap;
  gap: 4px;
  margin-bottom: 14px;
  width: 100%;
  max-width: 380px;
  padding: 0 4px;
  box-sizing: border-box;
}

.fs-aux-btn {
  background: none;
  border: none;
  cursor: pointer;
  color: var(--text-muted);
  display: flex;
  flex-direction: row;
  align-items: center;
  gap: 4px;
  padding: 6px 8px;
  border-radius: 8px;
  transition: all 0.2s;
  font-size: 11.5px;
  white-space: nowrap;
  flex: 0 1 auto;
  min-width: 0;
}

.fs-aux-btn span { white-space: nowrap; }

.fs-aux-btn:hover { color: var(--text-primary); background: var(--bg-elevated); }
.fs-aux-btn.active { color: var(--accent); }
.fs-aux-btn svg { width: 18px; height: 18px; fill: currentColor; }

.fs-fav {
  color: var(--text-muted);
}

.fs-fav svg {
  fill: none;
  stroke: currentColor;
  stroke-width: 2;
}

.fs-fav.faved {
  color: var(--danger);
}

.fs-fav.faved svg {
  fill: var(--danger);
  stroke: var(--danger);
}

/* ===== 音效面板 ===== */
.effect-panel {
  position: absolute;
  bottom: 120px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  width: 90%;
  max-width: 420px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  z-index: 20;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s var(--transition);
}

.effect-panel.active {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0);
}

.effect-panel-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 16px;
}

.effect-presets {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 20px;
}

.effect-preset {
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 12px 8px;
  border-radius: 10px;
  font-size: 13px;
  cursor: pointer;
  text-align: center;
  transition: all 0.2s;
}

.effect-preset:hover { border-color: var(--text-secondary); color: var(--text-primary); }
.effect-preset.active {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}

.effect-sliders {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.slider-row {
  display: flex;
  align-items: center;
  gap: 12px;
}

.slider-label {
  font-size: 12px;
  color: var(--text-muted);
  min-width: 50px;
}

.slider-row input[type="range"] {
  flex: 1;
  height: 4px;
  -webkit-appearance: none;
  background: var(--bg-elevated);
  border-radius: 2px;
  outline: none;
}

.slider-row input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
}

/* ===== 导入歌曲选择弹窗 ===== */
.import-modal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.8);
  z-index: 9999;
  display: none;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.import-modal.active {
  display: flex;
}

.import-modal-content {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  width: 92%;
  max-width: 480px;
  max-height: 80vh;
  display: flex;
  flex-direction: column;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  position: relative;
}

.import-modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 20px 24px 12px;
  border-bottom: 1px solid var(--border);
}

.import-modal-title {
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
}

.import-modal-close {
  background: none;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px;
  border-radius: 6px;
}

.import-modal-close:hover {
  background: var(--bg-elevated);
  color: var(--text-primary);
}

.import-modal-close svg {
  width: 20px;
  height: 20px;
}

.import-options {
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.import-option {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-elevated);
}

.import-option:hover {
  border-color: var(--accent);
  background: var(--bg-card);
  transform: translateY(-2px);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
}

.import-option-icon {
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: rgba(232, 197, 71, 0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  flex-shrink: 0;
}

.import-option-icon svg {
  width: 24px;
  height: 24px;
}

.import-option-text {
  flex: 1;
}

.import-option-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 4px;
}

.import-option-desc {
  font-size: 13px;
  color: var(--text-muted);
  line-height: 1.4;
}

.import-result-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
  flex-wrap: nowrap;
}

.import-toolbar-actions { display: none; align-items: center; gap: 6px; margin-left: auto; }
.import-toolbar-actions .net-rec-refresh { font-size: 12px; padding: 4px 10px; }

.import-select-all {
  display: flex;
  align-items: center;
  gap: 8px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text-secondary);
}

.import-select-all input[type="checkbox"] {
  width: 16px;
  height: 16px;
  cursor: pointer;
  accent-color: var(--accent);
}

.import-selected-count {
  font-size: 13px;
  color: var(--text-muted);
}

.import-result-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
  max-height: 300px;
}

.import-result-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 24px;
  cursor: pointer;
  transition: background 0.15s;
}

.import-result-item:hover {
  background: var(--bg-elevated);
}

.import-result-item input[type="checkbox"] {
  width: 16px;
  height: 16px;
  cursor: pointer;
  accent-color: var(--accent);
  flex-shrink: 0;
}

.import-result-icon {
  width: 32px;
  height: 32px;
  border-radius: 6px;
  background: rgba(232, 197, 71, 0.1);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--accent);
  flex-shrink: 0;
}

.import-result-icon svg {
  width: 16px;
  height: 16px;
}

.import-result-name {
  flex: 1;
  font-size: 14px;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.import-modal-footer {
  display: flex;
  gap: 12px;
  padding: 16px 24px;
  border-top: 1px solid var(--border);
}

.import-back-btn {
  flex: 1;
  padding: 10px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
}

.import-back-btn:hover {
  background: var(--bg-elevated);
  color: var(--text-primary);
}

.import-confirm-btn {
  flex: 1;
  padding: 10px;
  border: none;
  background: var(--accent);
  color: white;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
}

.import-confirm-btn:hover {
  opacity: 0.9;
}

/* ===== 歌曲列表面板 ===== */
.playlist-panel {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  max-height: 50%;
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  border-radius: 20px 20px 0 0;
  z-index: 20;
  transform: translateY(100%);
  transition: transform 0.3s var(--transition);
  display: flex;
  flex-direction: column;
}

.playlist-panel.active {
  transform: translateY(0);
}

.playlist-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
}

.playlist-panel-title {
  font-size: 15px;
  font-weight: 600;
}

.playlist-panel-close {
  background: var(--bg-elevated);
  border: none;
  color: var(--text-secondary);
  cursor: pointer;
  padding: 6px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.playlist-panel-close:hover {
  color: var(--text-primary);
  background: var(--bg-card);
}

.playlist-panel-close svg {
  width: 16px;
  height: 16px;
}

.playlist-panel-list {
  overflow-y: auto;
  padding: 8px 0;
}

.playlist-panel-item {
  display: flex;
  align-items: center;
  padding: 10px 20px;
  cursor: pointer;
  gap: 12px;
}

.playlist-panel-item:hover { background: var(--bg-elevated); }
.playlist-panel-item.playing { color: var(--accent); }

/* ===== 歌词搜索面板 ===== */
.lyrics-search-panel {
  position: absolute;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  width: 90%;
  max-width: 420px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 20px;
  z-index: 40;
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s var(--transition);
}

.lyrics-search-panel.active {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0);
}

.lyrics-search-title {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.lyrics-search-input {
  width: 100%;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  color: var(--text-primary);
  font-size: 14px;
  margin-bottom: 14px;
  outline: none;
}

.lyrics-search-input:focus {
  border-color: var(--accent);
}

.lyrics-search-results {
  max-height: 240px;
  overflow-y: auto;
}

.lyrics-search-result {
  padding: 12px;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.2s;
}

.lyrics-search-result:hover {
  background: var(--bg-elevated);
}

.lyrics-search-result-name {
  font-size: 14px;
  font-weight: 500;
  margin-bottom: 4px;
}

.lyrics-search-result-preview {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* 歌词搜索按钮 */
.lyrics-search-btn {
  position: absolute;
  top: 20px;
  left: 20px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 5px 12px;
  border-radius: 16px;
  cursor: pointer;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 4px;
  transition: all 0.2s;
  z-index: 10;
}

.lyrics-search-btn:hover {
  color: var(--text-primary);
  border-color: var(--text-secondary);
}

.lyrics-search-btn svg {
  width: 16px;
  height: 16px;
}


/* 全屏歌词：中间那条虚拟时间线 + 拖动时的时间气泡 */
.lyric-timeline {
  position: absolute;
  left: 9%;
  right: 9%;
  height: 0;
  border-top: 1px dashed rgba(232,197,71,.45);
  opacity: 0;
  transition: opacity .18s ease;
  pointer-events: none;
  z-index: 22;
}

/* 只有拖动歌词时才浮现 */
.lyrics-fullscreen.scrubbing .lyric-timeline { opacity: 1; }

.lyric-scrub-time {
  position: absolute;
  right: 7%;
  transform: translateY(-50%);
  padding: 2px 9px;
  border-radius: 999px;
  background: rgba(16,16,20,.92);
  border: 1px solid rgba(232,197,71,.35);
  color: var(--accent);
  font-size: 12px;
  letter-spacing: .5px;
  opacity: 0;
  transition: opacity .15s;
  pointer-events: none;
  z-index: 23;
}

/* 拖动选中的那一句 */
.lyrics-fullscreen .lyrics-line.scrub-focus {
  color: rgba(240,224,150,.95) !important;
  opacity: 1 !important;
}

/* ===== 歌词全屏模式 ===== */
.lyrics-fullscreen {
  position: absolute;
  inset: 0;
  background: var(--bg-deep);
  z-index: 30;
  display: none;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  padding: 60px 20px 160px;
}

.lyrics-fullscreen.active {
  display: flex;
  overflow: hidden;
}

/* 雪花飘动特效 */
.snow-container {
  position: absolute;
  inset: 0;
  pointer-events: none;
  overflow: hidden;
}

.snowflake {
  position: absolute;
  top: -10px;
  background: white;
  border-radius: 50%;
  opacity: 0.6;
  animation: snowfall linear infinite;
  filter: blur(1px);
}

@keyframes snowfall {
  0% {
    transform: translateY(-10px) translateX(0) rotate(0deg);
    opacity: 0;
  }
  10% {
    opacity: 0.6;
  }
  90% {
    opacity: 0.6;
  }
  100% {
    transform: translateY(100vh) translateX(30px) rotate(360deg);
    opacity: 0;
  }
}

.lyrics-fullscreen .lyrics-container {
  height: auto;
  width: 98%;
  max-width: 1400px;
  max-height: calc(100vh - 180px);
  mask-image: none;
  -webkit-mask-image: none;
  cursor: pointer;
  overflow-y: auto;
  overflow-x: hidden;
  scroll-behavior: smooth;
  padding-top: 40px;
  text-align: center;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.lyrics-fullscreen .lyrics-container::-webkit-scrollbar {
  display: none;
}

.lyrics-fullscreen .lyrics-line {
  font-size: 15px;
  padding: 10px 0;
  opacity: 0.5;
  cursor: pointer;
  transition: opacity 0.3s ease, font-size 0.3s ease;
  line-height: 1.6;
  position: relative;
  display: inline-block;
  max-width: 90%;
}

.lyrics-fullscreen .lyrics-line:hover {
  opacity: 0.8;
}

.lyrics-fullscreen .lyrics-line.active {
  font-size: 20px;
  opacity: 1;
}

.lyrics-fullscreen .lyrics-text-bg {
  color: var(--text-muted);
  word-wrap: break-word;
  overflow-wrap: break-word;
}

.lyrics-fullscreen .lyrics-text-fg {
  position: absolute;
  top: 10px;
  left: 0;
  color: var(--accent);
  overflow: hidden;
  word-wrap: break-word;
  overflow-wrap: break-word;
  text-shadow: 0 0 20px rgba(255, 107, 53, 0.4);
}

.lyrics-fullscreen-controls {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 16px;
  position: absolute;
  bottom: 32px;
  left: 0;
  right: 0;
  z-index: 10;
}

.lyrics-exit {
  position: absolute;
  top: 16px;
  left: 16px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 5px 12px;
  border-radius: 16px;
  cursor: pointer;
  font-size: 11px;
}

.lyrics-exit:hover { color: var(--text-primary); }

/* 歌词全屏内的搜索按钮 */
.lyrics-search-btn-fs {
  margin-top: 24px;
  background: var(--bg-elevated);
  border: 1px solid var(--border);
  color: var(--text-secondary);
  padding: 8px 20px;
  border-radius: 20px;
  cursor: pointer;
  font-size: 13px;
  display: flex;
  align-items: center;
  gap: 6px;
  transition: all 0.2s;
}

.lyrics-search-btn-fs:hover {
  color: var(--text-primary);
  border-color: var(--text-secondary);
}

/* ===== 空状态 ===== */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  color: var(--text-muted);
  gap: 18px;
}

.empty-state svg {
  width: 72px;
  height: 72px;
  opacity: 0.2;
}

.empty-text {
  font-size: 16px;
  font-weight: 500;
  color: var(--text-secondary);
}

.empty-hint {
  font-size: 13px;
  color: var(--text-muted);
}

/* ===== 滚动条 ===== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--bg-elevated); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ===== 响应式 ===== */
@media (max-width: 768px) {
  .main-content { grid-template-columns: 1fr; }
  .sidebar { display: none; }
  .mini-player { padding: 8px 16px 10px; }
  .disc-container { width: 180px; height: 180px; }
  .fs-song-name { font-size: 20px; }
  
  /* 手机端顶部栏适配 */
  .top-bar { 
    padding: 12px 16px; 
  }
  .search-row { padding: 8px 16px 10px; }
  .chart-grid { padding: 10px 12px 2px; gap: 8px; }
  .chart-card { height: 56px; font-size: 13px; }
  .logo { font-size: 18px; }
  .logo-icon { width: 32px; height: 32px; }
  .btn-import { 
    padding: 8px 14px; 
    font-size: 13px; 
  }
  .playlist-header {
    gap: 6px;
    padding: 8px 14px 10px;
  }
  .search-box { height: 36px; }
  .search-btn { height: 28px; padding: 0 12px; font-size: 12px; }
  .sort-controls {
    flex-wrap: wrap;
  }
}

/* ===== 网络推荐 ===== */
.song-cover {
  width: 38px;
  height: 38px;
  border-radius: 8px;
  object-fit: cover;
  background: rgba(255,255,255,.06);
  flex-shrink: 0;
  margin-right: 10px;
}
.net-rec-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 18px 2px;
  font-size: 12px;
  color: var(--text-muted);
}
.net-rec-refresh {
  padding: 5px 14px;
  font-size: 12px;
  border-radius: 14px;
  border: 1px solid var(--accent);
  color: var(--accent);
  background: transparent;
  cursor: pointer;
  white-space: nowrap;
}
.net-rec-refresh:disabled { opacity: .45; cursor: default; }
.dl-btn {
  flex: 0 0 22px;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: none;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  padding: 0;
  margin-right: 4px;
  flex-shrink: 0;
}
.dl-btn svg { width: 18px; height: 18px; }
.dl-btn.done { color: var(--accent); }
.dl-btn.loading { opacity: .45; }
.net-empty {
  text-align: center;
  padding: 56px 24px;
  color: var(--text-muted);
}
.net-empty svg { width: 46px; height: 46px; opacity: .45; margin-bottom: 14px; }
.net-tip { font-size: 11px; opacity: .55; margin-top: 3px; }
</style>
</head>
<body>

<div id="app">
  <!-- 顶部栏 -->
  <header class="top-bar">
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
      <span>声谷</span>
    </div>
    <div class="top-actions">
      <button class="btn-import" onclick="openImportModal()">导入音乐</button>
      <input type="file" id="fileInput" accept="audio/*,.mp3,.flac,.wav,.aac,.ogg,.m4a,.wma,.ape,.opus" multiple style="position:fixed;left:0;top:0;width:1px;height:1px;opacity:0.01;pointer-events:none;">
      <input type="file" id="folderInput" multiple accept="audio/*,.mp3,.flac,.wav,.aac,.ogg,.m4a,.wma,.ape,.opus" style="position:fixed;left:0;top:0;width:1px;height:1px;opacity:0.01;pointer-events:none;">
    </div>
  </header>


  <!-- 主内容 -->
  <div class="main-content">
    <!-- 播放列表 -->
    <main class="playlist-area">
      <div class="playlist-header">
        <div class="view-tabs">
          <button class="view-tab active" data-view="net" onclick="switchView('net')">网络推荐</button>
          <button class="view-tab view-tab-all" data-view="all" onclick="switchView('all')">本地歌曲</button>
          <button class="view-tab" data-view="favorites" onclick="switchView('favorites')">我的收藏</button>
        </div>

        <div class="search-box">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>
          </svg>
          <input id="songSearchInput" type="text" placeholder="搜索本地歌曲、网络歌曲"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();doSongSearch();}">
          <button class="search-clear" id="searchClearBtn" onclick="clearSongSearch()" style="display:none;">×</button>
          <button class="search-btn" onclick="doSongSearch()">搜索</button>
        </div>

        <div class="sort-controls">
          <span style="font-size:12px;color:var(--text-muted);margin-right:2px;">歌曲排序方式</span>
          <button class="sort-btn active" data-sort="added" onclick="setSort('added')">按添加时间</button>
          <button class="sort-btn" data-sort="name" onclick="setSort('name')">按字母</button>
        </div>
      </div>
      <div class="song-list" id="songList">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
          <div class="empty-text">还没有音乐</div>
          <div class="empty-hint">点击右上角「导入音乐」添加本地歌曲</div>
        </div>
      </div>
    </main>
  </div>

  <!-- 迷你播放器 -->
  <footer class="mini-player" id="miniPlayer">
    <!-- 顶部：进度条 -->
    <div class="mini-progress-row">
      <span class="time-display" id="currentTime">0:00</span>
      <div class="progress-bar" onclick="seekTo(event)">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <span class="time-display" id="totalTime">0:00</span>
      <div class="volume-btn" onclick="toggleVolumeSlider(event)" style="padding:4px;">
        <svg viewBox="0 0 24 24"><path d="M11 5L6 9H2v6h4l5 4V5z M15.54 8.46a5 5 0 0 1 0 7.07 M19.07 4.93a10 10 0 0 1 0 14.14"/></svg>
        <div class="volume-slider-pop" onclick="event.stopPropagation()">
          <div class="volume-slider-track" id="volumeTrack" onmousedown="startVolumeDrag(event)">
            <div class="volume-slider-fill" id="volumeFill"></div>
            <div class="volume-slider-thumb" id="volumeThumb"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="mini-main-row">
      <!-- 左侧：转动唱片 -->
      <div class="mini-album" id="miniAlbum" onclick="openFullscreen()">
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <img class="mini-album-img" id="miniAlbumImg" alt="">
        <svg viewBox="0 0 24 24" id="miniAlbumIcon"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>

      <!-- 中间：控制按钮 -->
      <div class="mini-controls-row">
        <button class="play-mode-btn" id="playModeBtn" onclick="cyclePlayMode()" title="顺序播放">
          <svg viewBox="0 0 24 24"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/></svg>
        </button>
        <button class="control-btn" onclick="prevSong()">
          <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
        </button>
        <button class="control-btn play-pause-btn" id="playPauseBtn" onclick="togglePlay()">
          <svg viewBox="0 0 24 24" id="playIcon"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <button class="control-btn" onclick="nextSong()">
          <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
        </button>
        <button class="mini-fav-btn" id="miniFavBtn" onclick="toggleFavorite()" title="收藏">
          <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        </button>
      </div>
    </div>
  </footer>
</div>

<!-- 全屏播放器 -->
<div class="fullscreen-player" id="fullscreenPlayer">
  <div class="bg-glow"></div>

  <button class="lyrics-search-btn" onclick="toggleLyricsSearch()">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <span>搜歌词</span>
  </button>

  <button class="fs-close" onclick="closeFullscreen()">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
  </button>

  <!-- 唱片 -->
  <div class="disc-container" id="discContainer">
    <div class="disc" id="disc" onclick="toggleSquareCover()">
      <img class="disc-full-cover" id="discFullCover" alt="">
      <div class="disc-cover" id="discCover">
        <svg viewBox="0 0 24 24"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      </div>
      <div class="disc-center"></div>
    </div>
  </div>

  <!-- 频谱 -->
  <canvas class="visualizer" id="visualizer"></canvas>

  <!-- 歌曲名 -->
  <div class="fs-song-info">
    <div class="fs-song-name" id="fsSongName">未播放歌曲</div>
  </div>

  <!-- 歌词（可点击进入全屏） -->
  <div class="lyrics-container" id="lyricsContainer" onclick="openLyricsFullscreen()">
    <div class="lyrics-line" data-time="0.0">正在加载歌词...</div>
  </div>

  <!-- 进度条 -->
  <div class="fs-progress-area">
    <span class="time-display" id="fsCurrentTime">0:00</span>
    <div class="progress-bar" onclick="seekTo(event)">
      <div class="progress-fill" id="fsProgressFill"></div>
    </div>
    <span class="time-display" id="fsTotalTime">0:00</span>
    <div class="volume-btn" onclick="toggleVolumeSlider(event)" style="position:relative;padding:4px;">

<audio id="audioPlayer"></audio>

<script>
// ===== 状态管理 =====
const state = {
  songs: [],        // {id, name, artist, url, duration, addedAt, isFav}
  currentIndex: -1,
  isPlaying: false,
  playMode: 'order',  // order | single | shuffle
  sortBy: 'added',
  currentView: 'net', // all | favorites | net（默认打开网络推荐）
  netChart: null,      // null | rank | rising | hot | douyin | new | rec
  searchQuery: '',     // 搜索关键词
  audioContext: null,
  analyser: null
};

const audio = document.getElementById('audioPlayer');
const MODE_LABELS = {
  order: '顺序播放',
  single: '单曲循环',
  shuffle: '随机播放'
};

// ===== Capacitor 原生环境检测与桥接 =====
const IS_NATIVE = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
function isNativeShell() { return IS_NATIVE; }
let nativeScanning = false;

function nativePlugin() {
  if (!IS_NATIVE || !window.Capacitor || !window.Capacitor.Plugins) return null;
  return window.Capacitor.Plugins.MusicScanner || null;
}

// 把手机上的真实文件路径转成 WebView 可以加载的地址
function toPlayableUrl(nativePath) {
  if (!nativePath) return '';
  if (IS_NATIVE && window.Capacitor && window.Capacitor.convertFileSrc) {
    return window.Capacitor.convertFileSrc(nativePath);
  }
  return nativePath;
}

async function nativeScanSongs() {
  const plugin = nativePlugin();
  if (!plugin) throw new Error('原生扫描插件不可用');
  const res = await plugin.scan();
  return (res && res.songs) ? res.songs : [];
}

// ===== 后台播放桥接（前台服务 + 通知栏 / 锁屏控制） =====
let bgServiceStarted = false;

function bgPlugin() {
  if (!IS_NATIVE || !window.Capacitor || !window.Capacitor.Plugins) return null;
  return window.Capacitor.Plugins.BackgroundAudio || null;
}

// 播放过程中每 5 秒刷一次通知栏进度，让系统迷你播放器的进度条能跟着走
let bgSyncTimer = null;
function startBgSyncTimer() {
  if (bgSyncTimer) return;
  bgSyncTimer = setInterval(() => {
    if (bgPlugin() && !audio.paused) syncNativeAudio();
  }, 5000);
}

// 把当前歌曲与播放状态同步到原生通知栏
function syncNativeAudio() {
  const p = bgPlugin();
  if (!p) return;
  const song = state.songs[state.currentIndex];
  const payload = {
    title: song ? song.name : '声谷音乐',
    artist: song ? (song.artist || '') : '',
    isPlaying: !audio.paused,
    position: audio.currentTime || 0,
    duration: (isFinite(audio.duration) && audio.duration > 0) ? audio.duration : (song ? (song.duration || 0) : 0),
    artwork: song ? (song.artwork || '') : ''
  };
  startBgSyncTimer();
  try {
    if (!bgServiceStarted) {
      bgServiceStarted = true;
      Promise.resolve(p.start(payload)).catch(e => console.log('后台播放启动失败:', e));
    } else {
      Promise.resolve(p.update(payload)).catch(e => console.log('后台播放更新失败:', e));
    }
  } catch (e) {
    console.log('后台播放调用异常:', e);
  }
}

// 原生（通知栏 / 锁屏 / 耳机）发来的控制指令
window.__nativeMediaCommand = function (cmd) {
  try {
    if (cmd === 'play') {
      if (audio.paused) togglePlay();
    } else if (cmd === 'pause') {
      if (!audio.paused) togglePlay();
    } else if (cmd === 'next') {
      nextSong();
    } else if (cmd === 'prev') {
      prevSong();
    } else if (typeof cmd === 'string' && cmd.indexOf('seek:') === 0) {
      const ms = parseFloat(cmd.slice(5));
      if (isFinite(ms) && ms >= 0) audio.currentTime = ms / 1000;
    }
  } catch (e) {
    console.log('执行原生控制指令失败:', e);
  }
};

// ===== IndexedDB 本地持久化存储 =====
const DB_NAME = 'shenguMusicDB';
const DB_STORE = 'tracks';
let db = null;

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains(DB_STORE)) {
        d.createObjectStore(DB_STORE, { keyPath: 'id' });
      }
    };
    req.onsuccess = e => { db = e.target.result; resolve(db); };
    req.onerror = e => reject(e);
  });
}

function dbPut(record) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).put(record);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e);
  });
}

function dbGetAll() {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readonly');
    const req = tx.objectStore(DB_STORE).getAll();
    req.onsuccess = () => resolve(req.result || []);
    req.onerror = e => reject(e);
  });
}

function dbDelete(id) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    tx.objectStore(DB_STORE).delete(id);
    tx.oncomplete = () => resolve();
    tx.onerror = e => reject(e);
  });
}

function dbUpdateMeta(id, patch) {
  return new Promise((resolve, reject) => {
    const tx = db.transaction(DB_STORE, 'readwrite');
    const store = tx.objectStore(DB_STORE);
    const getReq = store.get(id);
    getReq.onsuccess = () => {
      const rec = getReq.result;
      if (rec) { Object.assign(rec, patch); store.put(rec); }
      tx.oncomplete = () => resolve();
    };
    getReq.onerror = e => reject(e);
  });
}

// ===== 通用确认对话框（取消 / 导入） =====
let appConfirmResolver = null;
function appConfirm(opts) {
  const o = opts || {};
  return new Promise(resolve => {
    appConfirmResolver = resolve;
    document.getElementById('appConfirmTitle').textContent = o.title || '提示';
    document.getElementById('appConfirmMsg').textContent = o.message || '';
    document.getElementById('appConfirmOk').textContent = o.okText || '确定';
    document.getElementById('appConfirmCancel').textContent = o.cancelText || '取消';
    document.getElementById('appConfirm').classList.add('active');
  });
}
function resolveAppConfirm(v) {
  try { document.getElementById('appConfirm').classList.remove('active'); } catch (e) {}
  const r = appConfirmResolver;
  appConfirmResolver = null;
  if (r) r(!!v);
}

// ===== 导入歌曲 =====
let pendingImportFiles = [];

function openImportModal() {
  document.getElementById('importModal').classList.add('active');
  // 每次重新打开都从头开始：丢掉上次没确认的待导入列表
  pendingImportFiles = [];
  showImportEmpty();
  // App 内：打开弹窗就自动扫描本机音乐，直接把整库列成可多选的列表，
  // 不依赖系统文件选择器是否支持多选
  if (IS_NATIVE && nativePlugin()) {
    setTimeout(() => { nativeAutoScan(); }, 60);
  }
}

function closeImportModal() {
  document.getElementById('importModal').classList.remove('active');
}

function showImportEmpty(mode) {
  const step1 = document.getElementById('importStep1');
  const step2 = document.getElementById('importStep2');
  const listEl = document.getElementById('importResultList');
  step1.style.display = 'none';
  step2.style.display = 'block';
  listEl.style.maxHeight = 'none';
  document.querySelector('.import-modal-footer').style.display = 'none';
  document.querySelector('.import-result-toolbar').style.display = 'none';
  document.getElementById('importModalTitle').textContent = '导入本地音乐';

  const canPickFolder = supportsDirectoryPick();
  const scanning = mode === 'scanning' || (!mode && IS_NATIVE);

  if (scanning) {
    listEl.innerHTML = `
      <div style="text-align:center;padding:36px 18px;color:var(--text-muted);">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:40px;height:40px;margin-bottom:14px;opacity:.6;animation:spin 1.2s linear infinite;">
          <path d="M21 12a9 9 0 1 1-6.2-8.55"/><circle cx="12" cy="12" r="3"/>
        </svg>
        <div style="font-size:14px;">正在扫描本机音乐…</div>
      </div>`;
    return;
  }

  if (IS_NATIVE) {
    listEl.innerHTML = `
      <div style="text-align:center;padding:26px 18px;color:var(--text-muted);">
        <svg viewBox="0 0 24 24" fill="currentColor" style="width:44px;height:44px;margin-bottom:12px;opacity:0.5;"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <div style="font-size:15px;margin-bottom:8px;">没有扫描到可导入的音乐</div>
        <div style="font-size:12.5px;margin-bottom:20px;line-height:1.7;">确认手机里有音乐文件，并已允许读取音乐权限</div>
        <button onclick="nativeAutoScan()" style="padding:10px 24px;background:var(--accent);color:white;border:none;border-radius:8px;cursor:pointer;font-size:14px;min-width:200px;">
          重新扫描
        </button>
        <button onclick="pickMusicFilesMulti()" style="margin-top:12px;padding:10px 24px;background:transparent;color:var(--text-primary);border:1px solid var(--border);border-radius:8px;cursor:pointer;font-size:14px;min-width:200px;">
          从文件里选
        </button>
      </div>`;
  } else {
    listEl.innerHTML = `
      <div style="text-align:center;padding:26px 18px;color:var(--text-muted);">
        <svg viewBox="0 0 24 24" fill="currentColor" style="width:44px;height:44px;margin-bottom:12px;opacity:0.5;"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
        <div style="font-size:15px;margin-bottom:8px;">选择要导入的音乐</div>
        <div style="font-size:12.5px;margin-bottom:20px;">${canPickFolder ? '选择音乐文件夹，自动列出里面所有歌曲' : '打开系统选择器，长按第一首后可连续勾选其它歌曲'}</div>
        <button onclick="autoImportSongs()" style="padding:10px 24px;background:var(--accent);color:white;border:none;border-radius:8px;cursor:pointer;font-size:14px;">
          ${canPickFolder ? '扫描本地音乐' : '选择音乐文件'}
        </button>
      </div>`;
  }
}

// ===== App 内：一键自动扫描本机全部音乐 =====
async function nativeAutoScan() {
  if (nativeScanning) return;
  const plugin = nativePlugin();
  if (!plugin) {
    showImportNotice('当前不是 App 环境，无法自动扫描');
    return;
  }
  nativeScanning = true;
  showImportNotice('正在扫描本地音乐…');

  let scanned = [];
  try {
    scanned = await nativeScanSongs();
  } catch (err) {
    nativeScanning = false;
    const msg = (err && (err.message || err.errorMessage)) || String(err);
    showImportNotice('扫描失败：' + msg + '（请确认已允许读取音乐权限）');
    if (document.getElementById('importModal').classList.contains('active')) showImportEmpty('fallback');
    return;
  }
  nativeScanning = false;

  // 安卓 10+ 分区存储下媒体库可能不给可读的文件路径，只有 content://，
  // 这类条目也保留（mediaId 在），导入时由原生 importAudioIds() 复制成实体文件
  const usable = scanned.filter(item => item.mediaId || item.path);

  if (usable.length === 0) {
    showImportNotice('没有找到本地音乐文件，请确认手机里有音乐');
    if (document.getElementById('importModal').classList.contains('active')) showImportEmpty('fallback');
    return;
  }

  // 已存在于播放列表的保留在列表里并打标记，选中导入时会弹确认框（取消 / 导入）
  const existingIds = new Set(state.songs.map(s => s.id));
  const existingPaths = new Set(state.songs.map(s => s.nativePath).filter(Boolean));

  pendingImportFiles = usable.map(item => ({
    file: null,
    nativeId: item.id,
    mediaId: item.mediaId,
    nativePath: item.path || '',
    readable: !!item.readable,
    // 没有可读路径的一律标记为"需要原生复制"
    needsCopy: !item.path || item.readable === false,
    name: item.title || item.fileName || '未知歌曲',
    artist: item.artist || '',
    duration: item.duration || 0,
    dup: existingIds.has(item.id) || (!!item.path && existingPaths.has(item.path)),
    selected: true
  }));
  showImportResultList();

  const dupCount = pendingImportFiles.filter(i => i.dup).length;
  showImportNotice(`扫描到 ${usable.length} 首` + (dupCount ? `，其中 ${dupCount} 首已在列表` : ''));
}

// 判断当前是否运行在手机 App / WebView 环境
// 注意：打包壳（PakePlus、Tauri 等）常把 UA 改成桌面版 Chrome，
// 单看 UA 会误判成桌面浏览器，所以这里叠加多重特征判断。
function isMobileOrWebView() {
  const ua = navigator.userAgent || '';
  // 明确含移动端关键字
  if (/Android|iPhone|iPad|iPod|Mobile|HarmonyOS|Windows Phone/i.test(ua)) return true;
  // 常见打包壳标识
  if (/Tauri|PakePlus|Pake|; wv\)|MicroMessenger|Electron/i.test(ua)) return true;
  // 壳注入的全局对象
  if (window.__TAURI__ || window.__TAURI_INTERNALS__ || window.pakeplus || window.PakePlus) return true;
  // Windows WebView2 / 安卓 WebView 的内核对象
  if (window.chrome && window.chrome.webview) return true;
  // 触屏 + 窄屏（UA 被伪装时作为兜底判断）
  const touch = (navigator.maxTouchPoints || 0) > 0 && ('ontouchstart' in window);
  const narrow = Math.min(screen.width || 0, screen.height || 0) <= 820;
  return touch && narrow;
}

// 是否允许使用「选择文件夹」方式（仅真正桌面浏览器可用）
// 安卓 WebView 的 DOM 里虽然有 webkitdirectory 属性，但点击后会调用系统
// “选择文件夹”意图，多数 ROM 没有对应应用，直接弹“没有应用可执行此操作”
function supportsDirectoryPick() {
  if (isMobileOrWebView()) return false;
  try {
    const el = document.createElement('input');
    return 'webkitdirectory' in el;
  } catch (err) {
    return false;
  }
}

// 文件夹选择兜底：点了文件夹选择但拿不到文件时，自动降级为文件多选
let folderPickGuardTimer = null;
function armFolderPickFallback() {
  clearTimeout(folderPickGuardTimer);
  let gotChange = false;
  const onChange = () => { gotChange = true; cleanup(); };
  const cleanup = () => {
    clearTimeout(folderPickGuardTimer);
    document.getElementById('folderInput').removeEventListener('change', onChange);
    window.removeEventListener('focus', onFocus);
  };
  const onFocus = () => {
    window.removeEventListener('focus', onFocus);
    setTimeout(() => {
      if (!gotChange) {
        cleanup();
        showImportNotice('当前系统不支持选择文件夹，已切换为选择音乐文件');
        document.getElementById('fileInput').click();
      }
    }, 900);
  };
  document.getElementById('folderInput').addEventListener('change', onChange);
  window.addEventListener('focus', onFocus);
  folderPickGuardTimer = setTimeout(() => {
    if (!gotChange) cleanup();
  }, 60000);
}

function showImportNotice(msg) {
  let el = document.getElementById('importNotice');
  if (!el) {
    el = document.createElement('div');
    el.id = 'importNotice';
    el.style.cssText = 'position:fixed;left:50%;top:12%;transform:translateX(-50%);background:rgba(40,40,40,.95);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:9999;max-width:80%;text-align:center;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.display = 'block';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = 'none'; }, 2600);
}

// 手动选择音乐文件（支持多选）：手机上用系统文件选择器，一次可勾选多个音频
// 打开系统文件选择器多选音乐。
// App 内优先走原生 ACTION_OPEN_DOCUMENT（EXTRA_ALLOW_MULTIPLE），
// 因为 WebView 的 <input type="file" multiple> 在部分 ROM / 打包壳里会退化成单选甚至点不开；
// 原生不可用时再回退到网页 input。
async function pickMusicFilesMulti() {
  const plugin = nativePlugin();
  if (isNativeShell() && plugin && typeof plugin.pickAudioFiles === 'function') {
    try {
      const res = await plugin.pickAudioFiles();
      const list = (res && res.files) || [];
      if (list.length === 0) return; // 用户取消
      mergePendingNativeFiles(list);
      return;
    } catch (e) {
      console.log('原生多选失败，回退网页选择器:', e && e.message);
      showImportNotice('原生选择器不可用，改用网页选择器');
    }
  }
  // 兜底：网页文件选择器。两个关键点（安卓 WebView / 国产 ROM 的坑）：
  // ① 每次点击都新建 input——长期存在的隐藏 input 在部分 WebView 里会沿用第一次
  //    打开时算出来的选择器参数（单选），新建元素才能保证这次按多选打开；
  // ② accept 用 */*——部分国产文件管理器对 audio/* 只给单选，全类型才开放多选；
  //    选完由 getMusicFiles() 按扩展名过滤掉非音频。
  try {
    const oldPicker = document.getElementById('tempFilePicker');
    if (oldPicker) oldPicker.remove();
    const input = document.createElement('input');
    input.type = 'file';
    input.id = 'tempFilePicker';
    input.accept = '*/*';
    input.multiple = true;
    input.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;opacity:0;';
    input.addEventListener('change', (e) => {
      handleFiles(e);
      setTimeout(() => { try { input.remove(); } catch (err) {} }, 0);
    });
    document.body.appendChild(input);
    input.click();
  } catch (e) {
    showImportNotice('无法打开文件选择器：' + (e && e.message ? e.message : e));
  }
}

// 原生选中的文件累加进待导入列表（按路径去重）
function mergePendingNativeFiles(list) {
  list.forEach(f => {
    if (!f || !f.path) return;
    const dup = pendingImportFiles.some(o => o.nativePath && o.nativePath === f.path);
    if (dup) return;
    pendingImportFiles.push({
      nativePath: f.path,
      name: f.name || (f.fileName || '').replace(/\.[^/.]+$/, '') || '未命名歌曲',
      selected: true
    });
  });
  if (pendingImportFiles.length > 0) {
    showImportResultList();
  }
}

function autoImportSongs() {
  const folderInput = document.getElementById('folderInput');
  const fileInput = document.getElementById('fileInput');
  if (IS_NATIVE) {
    nativeAutoScan();
    return;
  }
  if (supportsDirectoryPick() && !isMobileOrWebView()) {
    // 桌面浏览器：动态挂上目录属性，再打开文件夹选择
    folderInput.setAttribute('webkitdirectory', '');
    folderInput.setAttribute('directory', '');
    armFolderPickFallback();
    folderInput.click();
  } else {
    // 手机 App / WebView：只用系统文件选择器，多选音乐文件导入
    folderInput.removeAttribute('webkitdirectory');
    folderInput.removeAttribute('directory');
    fileInput.click();
  }
}

function getMusicFiles(allFiles) {
  const musicExts = ['.mp3', '.flac', '.wav', '.aac', '.ogg', '.m4a', '.wma', '.ape', '.opus', '.mid', '.midi', '.amr', '.ac3', '.aiff', '.aif'];
  return allFiles.filter(f => {
    if (f.type && f.type.startsWith('audio/')) return true;
    const ext = '.' + (f.name.split('.').pop() || '').toLowerCase();
    return musicExts.includes(ext);
  });
}

function showImportResult(files) {
  // 累加而不是覆盖：某些打包壳（如 PakePlus）的系统选择器可能只允许单选，
  // 用户重复打开选择器逐首添加时，已选列表不能被清空；同名同大小视为同一首，去重。
  const added = files.map(file => ({
    file: file,
    name: file.name.replace(/\.[^/.]+$/, ''),
    selected: true
  }));
  added.forEach(item => {
    const key = item.name + '|' + ((item.file && item.file.size) || 0);
    const dup = pendingImportFiles.some(old => old.file && old.name && (old.name + '|' + ((old.file && old.file.size) || 0)) === key);
    if (!dup) pendingImportFiles.push(item);
  });
  showImportResultList();
}
